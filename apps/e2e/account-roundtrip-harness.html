<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>openom account round-trip harness</title></head>
<body>
  <output id="status">booting</output>
  <script type="module">
    import * as Comlink from '../app/src/vendor/comlink.js';
    import { composeAccountSession } from '../app/src/core/accountComposition.js';
    import { createAuthProvider } from '../app/src/core/authProvider.js';
    import { appCoreWorker, remoteTransport } from '../app/src/core/appCoreClient.js';
    import { RemoteStore } from '../app/src/core/remoteStore.js';
    import { TreeLibrary } from '../app/src/core/library.js';
    import { ensureTreeIdentity } from '../app/src/core/treeId.js';

    class FixedDevAuth {
      #subject = null;
      #subscribers = new Set();

      subject() { return this.#subject; }
      async getAccessToken() {
        if (!this.#subject) throw new Error('test provider is signed out');
        return this.#subject;
      }
      async registrationAttempt() {
        const accessToken = await this.getAccessToken();
        return { accessToken, issuer: '', subject: this.#subject };
      }
      onChange(callback) {
        this.#subscribers.add(callback);
        return () => this.#subscribers.delete(callback);
      }
      capabilities() { return { canSignUp: false, canLogin: false, sync: true }; }
      signIn(subject) {
        this.#subject = subject;
        for (const callback of this.#subscribers) callback();
      }
      dispose() { this.#subscribers.clear(); }
    }

    const parameters = new URL(location.href).searchParams;
    const serverUrl = parameters.get('server') ?? 'http://localhost:6060';
    const authMode = parameters.get('auth') ?? 'fixed-dev';
    const authUrl = parameters.get('authUrl') ?? '';
    const publishableKey = parameters.get('publishableKey') ?? '';
    if (authMode !== 'fixed-dev' && authMode !== 'supabase') throw new Error(`unsupported test auth: ${authMode}`);
    const worker = appCoreWorker();
    await worker.warm();
    let provider;
    const composition = await composeAccountSession(worker, {
      createAuth: (account) => {
        provider = authMode === 'supabase'
          ? createAuthProvider(account, {
              config: { provider: 'supabase', url: authUrl, publishableKey },
            })
          : new FixedDevAuth();
        return provider;
      },
      createRemote: (auth) => new RemoteStore({ baseUrl: serverUrl, auth }),
    });
    const { account, remote } = composition;

    async function attachTree(docId) {
      await worker.attachTransport(docId, Comlink.proxy(remoteTransport(remote)));
    }

    async function requireSync(docId) {
      const result = await worker.syncNow(docId);
      if (result?.state !== 'ok') {
        throw new Error(`tree sync failed: ${JSON.stringify(result)}`);
      }
    }

    async function signIn(memberId, credentials) {
      if (authMode === 'supabase') {
        if (typeof provider.signIn !== 'function') throw new Error('Supabase test provider cannot sign in');
        await provider.signIn(credentials);
        return;
      }
      provider.signIn(memberId);
    }

    window.accountAcceptance = {
      async createAndBackup({ passphrase, engine, given, credentials }) {
        const created = await account.createAccount(passphrase);
        await signIn(created.memberId, credentials);
        await account.enableSync();

        const identity = await ensureTreeIdentity(created.memberId);
        const provisioned = await worker.provisionTree({
          treeId: identity.bytes,
          docId: identity.uuid,
          engine,
        });
        await attachTree(identity.uuid);
        const tree = await new TreeLibrary(worker).open(identity.uuid, provisioned.didKey);
        await tree.createPerson({ given, surname: `${engine}-restored` });
        await requireSync(identity.uuid);

        return {
          memberId: created.memberId,
          authSubject: provider.subject(),
          treeId: [...identity.bytes],
          docId: identity.uuid,
          personName: `${given} ${engine}-restored`,
          accountState: {
            auth: account.state().auth,
            binding: account.state().binding,
            pending: [...account.state().pending],
          },
        };
      },

      async restoreAndOpen({ subject, credentials, passphrase, engine, treeId, docId }) {
        await signIn(subject, credentials);
        const restored = await account.restore({ passphrase });
        await attachTree(docId);
        await worker.restoreTree({ treeId: new Uint8Array(treeId), docId, engine });
        await requireSync(docId);
        const tree = await new TreeLibrary(worker).open(docId);
        return {
          memberId: restored.memberId,
          authSubject: provider.subject(),
          people: tree.allPeople().map((person) => `${person.given} ${person.surname}`.trim()),
          accountState: {
            auth: account.state().auth,
            binding: account.state().binding,
            pending: [...account.state().pending],
          },
        };
      },
    };
    document.querySelector('#status').textContent = 'ready';
  </script>
</body>
</html>
