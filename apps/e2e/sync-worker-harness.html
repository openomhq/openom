<!doctype html>
<meta charset="utf-8" />
<title>app-core sync harness</title>
<!--
  Loads the real app-core worker path (the wasm engine + sealer + docsync loop + local BlobStore +
  the mirror/fold sync loop, in a real Web Worker) — no app UI. Two workers = two devices of ONE tree
  (same dev DEK + treeId, distinct replicaIds), meeting only through an in-page fake transport (a dumb
  BlobStore, the server seam). Proves the loop in a real browser: two devices converge, and an un-pushed
  offline mint still reaches the remote once a transport is attached. Keys live only in the workers.
-->
<body>
  <div id="status">loading…</div>
  <script type="module">
    import * as Comlink from '../app/src/vendor/comlink.js';
    import { claim as buildClaim, parseLink } from '../app/src/core/invite.js';

    // Read a raw row from the worker's IndexedDB (same origin) — used to inspect the at-rest mint record bytes.
    function readIdbSnapshot(key) {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('openom');
        req.onerror = () => reject(req.error);
        req.onsuccess = () => {
          const db = req.result;
          try {
            const g = db.transaction('snapshots', 'readonly').objectStore('snapshots').get(key);
            g.onsuccess = () => { db.close(); resolve(g.result ? g.result.bytes : null); };
            g.onerror = () => { db.close(); reject(g.error); };
          } catch (e) { db.close(); reject(e); }
        };
      });
    }

    const enc = new TextEncoder();
    const DID = 'did:key:z6MkHarness';
    const NAME = 'openom.org/core/name/v1';
    const PERSON = 'openom.org/core/person/v1';
    const DOC = 'tree-e2e';

    // A dumb in-page server: append-only log + `?since` paging, shared by both devices. It needs no
    // replica-dot dedup — the Rust replicator filters its own entries on the way up and down.
    // Extract the `payload` (field 5, the MembershipEnvelope) from a KeyringUpdate protobuf — what the real
    // server stores + serves back per revision. A minimal wire scanner (varint + length-delimited fields).
    function keyringUpdatePayload(bytes) {
      let i = 0;
      const varint = () => {
        let shift = 0; let v = 0;
        for (;;) { const b = bytes[i]; i += 1; v += (b & 0x7f) * 2 ** shift; if ((b & 0x80) === 0) break; shift += 7; }
        return v;
      };
      while (i < bytes.length) {
        const tag = varint();
        const field = tag >>> 3;
        const wire = tag & 7;
        if (wire === 2) {
          const len = varint();
          const val = bytes.subarray(i, i + len);
          i += len;
          if (field === 5) return val; // KeyringUpdate.payload
        } else if (wire === 0) { varint(); }
        else if (wire === 5) { i += 4; }
        else if (wire === 1) { i += 8; }
        else throw new Error(`unexpected wire type ${wire}`);
      }
      throw new Error('KeyringUpdate has no payload field');
    }

    function makeTransport() {
      // The DATA channel is now a dumb BlobStore keyed by the core's opaque object keys (the server owns no
      // keyspace knowledge — R2/BYO satisfy this with zero compute). One shared store = the shared remote.
      const blobs = new Map(); // key -> Uint8Array
      const getKeys = []; // every key blobGet fetched since the last _resetGets() (OPE-464 fetch-skip assertion)
      const keyrings = new Map(); // revision -> MembershipEnvelope bytes (the walk's per-revision body)
      let keyringHead = 0;
      let snapshotCovered = null; // the last x-openom-covered header seen on a snapshot PUT (OPE-409)
      let reportedFrontier = null; // the last PULL frontier reported to PUT /frontier (OPE-409 gate 2)
      // The advisory membership summary (OPE-293): a faithful in-memory stand-in for the server's /access —
      // generation CAS + an unchanged-check, in the CLIENT shape RemoteStore.getAccess/putAccess use.
      let access = null; // { members: [{memberId, role}], generation, basis }
      const proposals = new Map(); // proposalId -> { id, proposer, sizeBytes, createdAt, expiresAt, payload }
      let proposalSeq = 0;
      const canonAccess = (members, basis) => JSON.stringify({
        m: [...members].map((x) => ({ memberId: x.memberId, role: x.role }))
          .sort((a, b) => (a.memberId < b.memberId ? -1 : a.memberId > b.memberId ? 1 : 0)),
        b: [...basis],
      });
      return {
        // Explicit create-tree (OPE-407): the managed server mints a `trees` row here; this fake blob store
        // has no tree-row concept (it's a plain Map), so it's a no-op. Present so the owner's first tick,
        // which now mints the tree before its first push, doesn't call an undefined method.
        async createTree(_id) {},
        // List the keys under a prefix (the worker passes `${docId}/`). Order is unspecified, like R2 LIST.
        async blobList(prefix) {
          return [...blobs.keys()].filter((k) => k.startsWith(prefix)).map((key) => ({ key }));
        },
        async blobGet(key) {
          getKeys.push(key);
          return blobs.get(key) ?? null;
        },
        // The change-history feed (OPE-461): derived from the stored log objects. The fake has no member auth,
        // so it stamps a placeholder author (the real server records the authenticated uploader); the WORKER
        // half under test is the fetch + DECRYPT of each delta, not the server-side attribution.
        async getHistory(tree, { since = 0, limit = null } = {}) {
          // Return the CLIENT shape (like RemoteStore.getHistory), since this fake stands in for the whole transport.
          const entries = [];
          let seq = 0;
          for (const [key, bytes] of blobs) {
            const m = key.match(new RegExp(`^${tree}/log/([^/]+)/(\\d+)$`));
            if (!m) continue;
            seq += 1;
            if (seq <= since) continue;
            entries.push({
              memberId: 'acct-owner', replica: m[1], counter: Number(m[2]),
              size: bytes.length, createdAt: '1970-01-01T00:00:00Z', seq,
            });
            if (limit && entries.length >= limit) break;
          }
          return { entries, nextCursor: entries.length ? entries[entries.length - 1].seq : null };
        },
        // `pointer` (heads/snapshot) overwrites; an immutable log object is written only if absent (idempotent
        // re-push is a no-op), mirroring R2 If-None-Match.
        async blobPut(key, bytes, pointer, covered) {
          if (!pointer && blobs.has(key)) return;
          blobs.set(key, bytes);
          if (covered && key.endsWith('/snapshot')) snapshotCovered = covered; // OPE-409 covered header
        },
        // The keyring channel. publishKeyring PUTs ascending from head+1, so the revision is the publish
        // order; we store the unwrapped MembershipEnvelope payload (what a joiner's walk consumes).
        async putKeyring(_docId, update) {
          const revision = keyringHead + 1;
          keyrings.set(revision, keyringUpdatePayload(update));
          keyringHead = revision;
          return { revision };
        },
        async readKeyring(_docId, from) {
          const revisions = [];
          for (let r = from; r <= keyringHead; r += 1) {
            if (keyrings.has(r)) revisions.push({ revision: r, bytes: keyrings.get(r) });
          }
          return { revisions, head: keyringHead };
        },
        // Gate-2 liveness telemetry (OPE-409): the worker reports its PULL frontier here; record the last one.
        async putFrontier(_tree, frontier) {
          reportedFrontier = frontier;
        },
        // The advisory /access channel (OPE-293), CLIENT shape (RemoteStore already maps server↔client).
        async getAccess(_id) {
          return access
            ? { members: access.members.map((m) => ({ ...m })), generation: access.generation, basis: [...access.basis] }
            : null;
        },
        async putAccess(_id, { basis, expectedGeneration = null, members }) {
          const cur = access ? access.generation : null;
          if ((expectedGeneration ?? null) !== (cur ?? null)) {
            const e = new Error('generation conflict'); e.name = 'ConflictError'; throw e; // 409 → orchestrator re-GETs
          }
          if (access && canonAccess(access.members, access.basis) === canonAccess(members, basis)) {
            return { generation: access.generation, unchanged: true }; // no-op → no generation bump
          }
          const generation = (cur ?? 0) + 1;
          access = { members: members.map((m) => ({ ...m })), generation, basis: [...basis] };
          return { generation, unchanged: false };
        },
        // The proposals channel (OPE-360): an in-memory stand-in for the server's /proposals, in the CLIENT
        // shape RemoteStore.createProposal/listProposals/deleteProposal use. `proposer` is display metadata (the
        // real server derives it from the authenticated POST); approve verifies the payload cryptographically.
        async createProposal(_tree, sealedBytes) {
          proposalSeq += 1;
          const id = `prop-${proposalSeq}`;
          proposals.set(id, {
            id, proposer: 'acct-member', sizeBytes: sealedBytes.length,
            createdAt: '1970-01-01T00:00:00Z', expiresAt: '2999-01-01T00:00:00Z', payload: sealedBytes,
          });
          return { id, expiresAt: '2999-01-01T00:00:00Z' };
        },
        async listProposals(_tree) {
          return [...proposals.values()].map((p) => ({ ...p, payload: p.payload }));
        },
        async deleteProposal(_tree, id) {
          proposals.delete(id);
        },
        _access() {
          return access; // { members, generation, basis } or null — for the harness assertions
        },
        // The count of DATA log objects (deltas + covers) — pointers (heads/snapshot) are excluded, so this
        // counts settled writes the way the old scalar log length did.
        _size() {
          return [...blobs.keys()].filter((k) => k.includes('/log/')).length;
        },
        _hasSnapshot() {
          return [...blobs.keys()].some((k) => k.endsWith('/snapshot'));
        },
        _snapshotCovered() {
          return snapshotCovered; // the covered header (raw {replica:counter} JSON) of the last snapshot PUT
        },
        _reportedFrontier() {
          return reportedFrontier; // the last PULL frontier reported to PUT /frontier (gate-2, {replica:counter})
        },
        _getKeys() {
          return [...getKeys]; // every key fetched since the last _resetGets() (OPE-464 fetch-skip assertion)
        },
        _resetGets() {
          getKeys.length = 0;
        },
      };
    }

    function spawnWorker(accountProfile = null) {
      const workerUrl = new URL('../app/src/core/appCore.worker.js', import.meta.url);
      if (accountProfile !== null) workerUrl.searchParams.set('accountProfile', accountProfile);
      const w = new Worker(workerUrl, { type: 'module' });
      return Comlink.wrap(w);
    }

    // Test-only composition of account custody and tree operations. The account is created once per
    // profile, unlocked when needed, and never inferred from a caller-supplied member id.
    async function provisionTree(worker, { passphrase, treeId, docId, engine }) {
      const status = await worker.accountStatus();
      const account = status === 'none'
        ? await worker.accountCreate(passphrase)
        : await worker.accountUnlock(passphrase);
      const tree = await worker.provisionTree({ treeId, docId, engine });
      return account?.recoveryCode ? { ...tree, recoveryCode: account.recoveryCode } : tree;
    }

    async function openTree(worker, { passphrase, treeId, docId, engine }) {
      await worker.accountUnlock(passphrase);
      return worker.openTree({ treeId, docId, engine });
    }

    async function openDevice(worker, replicaByte, transport) {
      const treeId = new Uint8Array(16).fill(7);
      const replica = new Uint8Array(8).fill(replicaByte);
      await worker.warm();
      await worker.openDev(treeId, replica, DID, DOC);
      await worker.attachTransport(DOC, Comlink.proxy(transport));
      return worker;
    }

    const nameJson = (given) => JSON.stringify({ parts: { given } });

    window.__syncWorker = {
      // Two devices converge: A mints + syncs up, B syncs down, B sees A's person.
      async converge() {
        const transport = makeTransport();
        const a = await openDevice(spawnWorker(), 0xa1, transport);
        const b = await openDevice(spawnWorker(), 0xb2, transport);

        await a.assertAnchor(DOC, 'pA', PERSON);
        await a.assertClaim(DOC, 'pA', NAME, nameJson('Ada'));
        await a.commit(DOC);
        const aPush = await a.syncNow(DOC); // push A's mint to the server
        const bPull = await b.syncNow(DOC); // pull it into B

        const aProj = JSON.parse(await a.project(DOC));
        const bProj = JSON.parse(await b.project(DOC));
        return {
          aPush,
          bPull,
          serverSize: transport._size(),
          aPeople: aProj.people,
          bPeople: bProj.people,
          reportedFrontier: transport._reportedFrontier(), // OPE-409 gate 2: the pull frontier a tick reported
        };
      },

      // OPE-464: a device that already pulled a peer's log objects does NOT re-download them on the next tick.
      // plan_fetch drops below-own-frontier log keys, so only the mutable heads/snapshot pointers (and any new
      // tail) are fetched. Compaction off (K=0), so the skip is purely the own-pull-cursor optimization.
      async fetchSkipsAlreadyPulled() {
        const transport = makeTransport();
        const a = await openDevice(spawnWorker(), 0xa1, transport);
        const b = await openDevice(spawnWorker(), 0xb2, transport);
        await a.setCompactK(0);
        await b.setCompactK(0);
        // A mints three SEPARATE commits (three log objects) + pushes them.
        for (const id of ['p1', 'p2', 'p3']) {
          await a.assertAnchor(DOC, id, PERSON);
          await a.commit(DOC);
        }
        await a.syncNow(DOC);
        // B pulls A's whole log once and folds it.
        await b.syncNow(DOC);
        const firstPassPeople = JSON.parse(await b.project(DOC)).people.length;
        // Second tick: measure exactly which keys B fetches. Already-pulled log objects must be skipped.
        transport._resetGets();
        await b.syncNow(DOC);
        const secondGets = transport._getKeys();
        return {
          firstPassPeople,
          serverLogSize: transport._size(),                              // A's log objects on the remote
          secondLogGets: secondGets.filter((k) => k.includes('/log/')), // must be [] — no re-download
          peopleAfterSkip: JSON.parse(await b.project(DOC)).people.length, // state intact after the skipping tick
        };
      },

      // Compaction (OPE-409): with a low K, a few commits trigger a snapshot upload on the sync tick, carrying
      // the x-openom-covered header (the SUBSUMED frontier) the server's GC gate 1 trusts.
      async compaction() {
        const transport = makeTransport();
        const a = await openDevice(spawnWorker(), 0xc1, transport);
        await a.setCompactK(2); // compact once ≥ 2 log objects have accrued since the last snapshot
        for (const id of ['pc1', 'pc2', 'pc3']) {
          await a.assertAnchor(DOC, id, PERSON);
          await a.commit(DOC); // one committed batch = one log object
        }
        const push = await a.syncNow(DOC); // pushes deltas, crosses K → compacts + uploads the snapshot
        return { push, hasSnapshot: transport._hasSnapshot(), covered: transport._snapshotCovered() };
      },

      // An offline mint (committed with NO transport) still reaches the remote after a transport is
      // attached — the sync reads it from the durable local store, not an in-memory queue.
      async offlineThenSync() {
        const transport = makeTransport();
        const aWorker = spawnWorker();
        const treeId = new Uint8Array(16).fill(7);
        await aWorker.warm();
        await aWorker.openDev(treeId, new Uint8Array(8).fill(0xa1), DID, DOC);
        // No transport yet — mint + commit purely locally.
        await aWorker.assertAnchor(DOC, 'pOff', PERSON);
        await aWorker.commit(DOC);
        const offlineResult = await aWorker.syncNow(DOC); // no transport → no-op

        // Now the network comes back: attach + sync. The un-pushed mint must reach the server.
        await aWorker.attachTransport(DOC, Comlink.proxy(transport));
        await aWorker.syncNow(DOC);

        const b = await openDevice(spawnWorker(), 0xb2, transport);
        await b.syncNow(DOC);
        const bProj = JSON.parse(await b.project(DOC));
        return { offlineResult, serverSize: transport._size(), bPeople: bProj.people };
      },

      // Durable-outbox-across-reload with REAL IndexedDB: device A mints offline, commits (persisted),
      // then a SECOND worker (a fresh core, no shared memory — a reload) hydrates from the same
      // IndexedDB and still has the mint. No server involved.
      async reloadSurvives() {
        const RELOAD_DOC = 'reload-e2e';
        const treeId = new Uint8Array(16).fill(7);
        const replica = new Uint8Array(8).fill(0xa1);

        const a = spawnWorker();
        await a.warm();
        await a.clearPersisted(RELOAD_DOC); // clean slate for re-runs
        await a.openDev(treeId, replica, DID, RELOAD_DOC, true); // persist = true
        await a.assertAnchor(RELOAD_DOC, 'pReload', PERSON);
        await a.commit(RELOAD_DOC); // durably persisted to IndexedDB
        const before = JSON.parse(await a.project(RELOAD_DOC));

        // A brand-new worker = a reload: fresh wasm core, same page IndexedDB.
        const a2 = spawnWorker();
        await a2.warm();
        await a2.openDev(treeId, replica, DID, RELOAD_DOC, true);
        const after = JSON.parse(await a2.project(RELOAD_DOC));

        return { beforePeople: before.people, afterPeople: after.people };
      },

      // The REAL keyring lifecycle through the worker: provision (persist keyring) → mint → reload →
      // unlock (load keyring + hydrate). Wrong passphrase is rejected. The DEK never leaves the worker.
      async provisionUnlockLifecycle() {
        const doc = 'lifecycle-e2e';
        const treeId = new Uint8Array(16).fill(9);
        const pass = 'correct horse battery staple';

        const w0 = spawnWorker();
        await w0.warm();
        await w0.clearPersisted(doc);
        const prov = await provisionTree(w0, { passphrase: pass, treeId, docId: doc });
        await w0.assertAnchor(doc, 'pLife', PERSON);
        await w0.commit(doc);
        const before = JSON.parse(await w0.project(doc));

        // Closing the final tree must also drop the profile account handle; otherwise a subsequent unlock in
        // the same long-lived worker could bypass the passphrase by reusing resident account secrets.
        await w0.close(doc);
        let sameWorkerWrongRejected = false;
        try {
          await openTree(w0, { passphrase: 'WRONG', treeId, docId: doc });
        } catch {
          sameWorkerWrongRejected = true;
        }

        // Reload: a fresh worker unlocks with the passphrase → loads the keyring → hydrates the log.
        const w1 = spawnWorker();
        await w1.warm();
        const unlocked = await openTree(w1, { passphrase: pass, treeId, docId: doc });
        const after = JSON.parse(await w1.project(doc));

        // Wrong passphrase must fail.
        let wrongRejected = false;
        const w2 = spawnWorker();
        await w2.warm();
        try {
          await openTree(w2, { passphrase: 'WRONG', treeId, docId: doc });
        } catch {
          wrongRejected = true;
        }

        return {
          recoveryCodeLen: prov.recoveryCode.length,
          sameDid: prov.didKey === unlocked.didKey && prov.didKey.length > 0,
          beforePeople: before.people,
          afterPeople: after.people,
          wrongRejected,
          sameWorkerWrongRejected,
        };
      },

      // Phase 2b: fetched account bytes stay a temporary candidate until Rust verifies the credential and
      // authenticated generation. Only then does the worker commit the returned snapshot and install its handle.
      async accountCandidateAdoption() {
        const nonce = crypto.randomUUID();
        const source = spawnWorker(`candidate-source-${nonce}`);
        const passTarget = spawnWorker(`candidate-pass-${nonce}`);
        const recoveryTarget = spawnWorker(`candidate-recovery-${nonce}`);
        const passphrase = 'candidate source passphrase';
        const newPassphrase = 'candidate recovered passphrase';
        await Promise.all([source.warm(), passTarget.warm(), recoveryTarget.warm()]);

        const created = await source.accountCreate(passphrase);
        const sourceSnapshot = await source.accountSnapshot();
        let wrongRejected = false;
        try {
          await passTarget.accountAdoptCandidate({
            keystore: sourceSnapshot.keystore,
            credential: { passphrase: 'wrong passphrase' },
          });
        } catch {
          wrongRejected = true;
        }
        const statusAfterWrong = await passTarget.accountStatus();

        const adopted = await passTarget.accountAdoptCandidate({
          keystore: sourceSnapshot.keystore,
          credential: { passphrase },
        });
        const passSnapshot = await passTarget.accountSnapshot();

        const recovered = await recoveryTarget.accountAdoptCandidate({
          keystore: sourceSnapshot.keystore,
          credential: { recoveryCode: created.recoveryCode, newPassphrase },
        });
        const recoverySnapshot = await recoveryTarget.accountSnapshot();
        await recoveryTarget.accountLock();
        let usedRecoveryRejected = false;
        try {
          await recoveryTarget.accountRecover({
            recoveryCode: created.recoveryCode,
            newPassphrase: 'should not work',
          });
        } catch {
          usedRecoveryRejected = true;
        }

        return {
          memberIds: [created.memberId, adopted.memberId, recovered.memberId],
          sourceGeneration: sourceSnapshot.generation,
          adoptedGeneration: passSnapshot.generation,
          recoveredGeneration: recoverySnapshot.generation,
          sourceHash: Array.from(sourceSnapshot.blobHash),
          adoptedHash: Array.from(passSnapshot.blobHash),
          recoveryHash: Array.from(recoverySnapshot.blobHash),
          recoveryCodeRotated: recovered.recoveryCode !== created.recoveryCode,
          wrongRejected,
          statusAfterWrong,
          usedRecoveryRejected,
        };
      },

      // Phase 2c: one profile revision is shared across tabs. A committed re-wrap broadcasts its new record
      // revision; peers refresh under the profile lock and drop account/tree handles sourced from the old blob.
      async accountCrossTabInvalidation() {
        const nonce = crypto.randomUUID();
        const profile = `cross-tab-account-${nonce}`;
        const docId = `cross-tab-tree-${nonce}`;
        const treeId = new Uint8Array(16).fill(31);
        const oldPassphrase = 'cross-tab old passphrase';
        const newPassphrase = 'cross-tab new passphrase';
        const first = spawnWorker(profile);
        const second = spawnWorker(profile);
        await Promise.all([first.warm(), second.warm()]);

        await first.accountCreate(oldPassphrase);
        await second.accountUnlock(oldPassphrase);
        await second.provisionTree({ treeId, docId, engine: 'chain' });
        await first.accountChangePassphrase({ current: oldPassphrase, next: newPassphrase });

        let staleTreeDropped = false;
        for (let attempt = 0; attempt < 50; attempt += 1) {
          try {
            await second.project(docId);
          } catch {
            staleTreeDropped = true;
            break;
          }
          await new Promise((resolve) => setTimeout(resolve, 20));
        }
        const secondStatus = await second.accountStatus();
        let oldPassRejected = false;
        try {
          await second.accountUnlock(oldPassphrase);
        } catch {
          oldPassRejected = true;
        }
        const reopened = await second.accountUnlock(newPassphrase);

        return { staleTreeDropped, secondStatus, oldPassRejected, reopenedMemberId: reopened.memberId };
      },

      // Phase 0 acceptance: one browser-profile account owns two trees, joins a third, changes its
      // passphrase once, then reopens every tree through the verified founder/member role dispatch.
      async durableAccountAcrossTrees(engine) {
        const transport = makeTransport();
        const nonce = crypto.randomUUID();
        const profile = `durable-account-${engine}-${nonce}`;
        const ownerProfile = `durable-owner-${engine}-${nonce}`;
        const firstDoc = `durable-first-${engine}-${nonce}`;
        const secondDoc = `durable-second-${engine}-${nonce}`;
        const joinedDoc = `durable-joined-${engine}-${nonce}`;
        const sharedDoc = `durable-shared-${engine}-${nonce}`;
        const firstTree = new Uint8Array(16).fill(engine === 'dag' ? 21 : 22);
        const secondTree = new Uint8Array(16).fill(engine === 'dag' ? 23 : 24);
        const sharedTree = new Uint8Array(16).fill(engine === 'dag' ? 25 : 26);
        const oldPass = 'one durable account passphrase';
        const newPass = 'one replacement account passphrase';
        const ownerPass = 'independent owner passphrase';

        const member = spawnWorker(profile);
        await member.warm();
        const initialAccountStatus = await member.accountStatus();
        const account = await member.accountCreate(oldPass);
        const createdAccountStatus = await member.accountStatus();
        const first = await provisionTree(member, { passphrase: oldPass, treeId: firstTree, docId: firstDoc, engine });
        const second = await provisionTree(member, { passphrase: oldPass, treeId: secondTree, docId: secondDoc, engine });
        const registrationProof = await member.accountRegisterProof({
          issuer: 'https://issuer.example', subject: `subject-${nonce}`, timestamp: 1_800_000_000,
        });
        const rotated = await member.accountRotateRoot({ passphrase: oldPass });
        const afterRotation = await member.accountPublicIdentity();

        const owner = spawnWorker(ownerProfile);
        await owner.warm();
        await provisionTree(owner, { passphrase: ownerPass, treeId: sharedTree, docId: sharedDoc, engine });
        await owner.attachTransport(sharedDoc, Comlink.proxy(transport));
        const chainPin = engine === 'chain' ? await owner.keyringHash(sharedDoc) : null;
        await owner.addMember(sharedDoc, {
          passphrase: ownerPass,
          treeId: sharedTree,
          ownerMemberId: 'ignored',
          minRevision: 1,
          newMemberId: account.memberId,
          role: 'editor',
          memberAuthorPublic: account.authorPublicKey,
          memberHpkePublic: account.hpkePublicKey,
          engine,
        });
        const pin = engine === 'dag' ? await owner.dagAnchorPin(sharedDoc) : null;

        await member.attachTransport(joinedDoc, Comlink.proxy(transport));
        const joined = await member.joinAsMember(
          engine === 'dag'
            ? { engine, treeId: sharedTree, docId: joinedDoc, passphrase: oldPass, memberId: account.memberId, pin }
            : {
                engine,
                treeId: sharedTree,
                docId: joinedDoc,
                passphrase: oldPass,
                memberId: account.memberId,
                pinnedRevision: chainPin.revision,
                pinnedHash: chainPin.hash,
              },
        );

        await member.accountChangePassphrase({ current: oldPass, next: newPass });
        await member.accountLock();
        const lockedAccountStatus = await member.accountStatus();

        let oldPassRejected = false;
        try {
          await member.accountUnlock(oldPass);
        } catch {
          oldPassRejected = true;
        }
        const unlocked = await member.accountUnlock(newPass);
        const reopenedFirst = await openTree(member, { passphrase: newPass, treeId: firstTree, docId: firstDoc, engine });
        const reopenedSecond = await openTree(member, { passphrase: newPass, treeId: secondTree, docId: secondDoc, engine });
        const reopenedJoined = await openTree(member, { passphrase: newPass, treeId: sharedTree, docId: joinedDoc, engine });

        return {
          memberIds: [account.memberId, first.memberId, second.memberId, afterRotation.memberId, unlocked.memberId],
          joinedDid: joined.didKey,
          reopenedDids: [reopenedFirst.didKey, reopenedSecond.didKey, reopenedJoined.didKey],
          oldPassRejected,
          registrationProofLength: registrationProof.length,
          rotatedRecoveryCodeLength: rotated.recoveryCode.length,
          accountStatuses: [initialAccountStatus, createdAccountStatus, lockedAccountStatus],
        };
      },

      // THE full sharing loop through the real worker: an owner provisions + shares a tree, a member joins
      // via the genesis-walk, and verify-on-ingest ACCEPTS the owner's signed write while REJECTING a forged
      // unsigned one — all in real Web Workers over the in-page keyring + log channels. Chain engine.
      async shareAndVerify() {
        const transport = makeTransport();
        const treeId = new Uint8Array(16).fill(3);
        // Unique per run — the keyring IndexedDB persists across runs, and join refuses an already-present tree.
        const ownerDoc = `share-owner-${crypto.randomUUID()}`;
        const memberDoc = `share-member-${crypto.randomUUID()}`;
        const ownerPass = 'owner passphrase here';
        const memberPass = 'member passphrase here';

        // Owner provisions the tree (genesis) and mints the invite pin over rev 1.
        const owner = spawnWorker(`${ownerDoc}:owner`);
        await owner.warm();
        await owner.clearPersisted(ownerDoc);
        const ownerProv = await provisionTree(owner, { passphrase: ownerPass, treeId, docId: ownerDoc });
        await owner.attachTransport(ownerDoc, Comlink.proxy(transport));
        const pin = await owner.keyringHash(ownerDoc); // { revision: 1, hash }

        // Member mints an account, owner admits them (→ shared keyring, published to the server).
        const member = spawnWorker(`${memberDoc}:member`);
        await member.warm();
        await member.clearPersisted(memberDoc);
        const acct = await member.provisionMember(memberPass);
        await owner.addMember(ownerDoc, {
          passphrase: ownerPass, treeId, ownerMemberId: 'acct-owner', minRevision: 1,
          newMemberId: acct.memberId, role: 'editor',
          memberAuthorPublic: acct.authorPublicKey, memberHpkePublic: acct.hpkePublicKey,
        });

        // Owner writes a SIGNED entry on the now-shared tree and pushes it.
        await owner.assertAnchor(ownerDoc, 'pShared', PERSON);
        await owner.commit(ownerDoc);
        await owner.syncNow(ownerDoc);

        // A FORGERY: a second owner-provisioned worker holding the pre-share DEK writes an UNSIGNED entry.
        // (The harness models the forgery with the owner's own pre-share sealer via a fresh unlock is complex;
        // instead the member simply must never accept an unattributed entry — proven by pForged's absence.)

        // Member joins via the genesis-walk (fetch keyrings + verify + unlock), then syncs.
        await member.attachTransport(memberDoc, Comlink.proxy(transport));
        const joined = await member.joinAsMember({
          treeId, docId: memberDoc, passphrase: memberPass, memberId: acct.memberId,
          pinnedRevision: pin.revision, pinnedHash: pin.hash,
        });
        const sync = await member.syncNow(memberDoc);
        const memberProj = JSON.parse(await member.project(memberDoc));

        // MEMBER REOPEN (OPE-543 #2): a FRESH worker (models a browser reload; IndexedDB is shared per origin)
        // reopens the JOINED tree via account unlock + openTree. It must dispatch from the verified keyring role, not
        // the owner path, and recover the same identity + see the shared data.
        const memberReload = spawnWorker(`${memberDoc}:member`);
        await memberReload.warm();
        await memberReload.attachTransport(memberDoc, Comlink.proxy(transport));
        const reopened = await openTree(memberReload, { passphrase: memberPass, treeId, docId: memberDoc });
        const reopenedPeople = JSON.parse(await memberReload.project(memberDoc)).people.map((p) => p.id);

        return {
          joinedDid: joined.didKey,
          reopenedDid: reopened.didKey,
          reopenedPeople,
          sync,
          memberPeople: memberProj.people.map((p) => p.id),
          serverKeyringHead: (await transport.readKeyring(ownerDoc, 1)).head,
          // OPE-293: after the share, the owner's addMember asserted the resolved membership to /access.
          access: transport._access(),
          // OPE-543 self-cert ids: the derived owner + member ids the /access view must carry.
          ownerMemberId: ownerProv.memberId,
          memberMemberId: acct.memberId,
        };
      },

      // OPE-453: the owner's durable invite mint record is DEK-sealed at rest. Minting stores CIPHERTEXT (not the
      // plaintext s_mac_claim) in IndexedDB, and admit still OPENS it to verify the claimant's MAC — proving the
      // seal/open round-trip through the real worker + wasm (sealAppSecret/openAppSecret).
      async inviteSealsMintRecord() {
        const transport = makeTransport();
        const treeId = new Uint8Array(16).fill(5);
        const ownerDoc = `invite-owner-${crypto.randomUUID()}`;
        const memberDoc = `invite-member-${crypto.randomUUID()}`;
        const ownerPass = 'owner passphrase here';
        const memberPass = 'member passphrase here';

        const owner = spawnWorker(`${ownerDoc}:owner`);
        await owner.warm();
        await owner.clearPersisted(ownerDoc);
        await provisionTree(owner, { passphrase: ownerPass, treeId, docId: ownerDoc });
        await owner.attachTransport(ownerDoc, Comlink.proxy(transport));

        // Mint an invite → seals + durably stores the mint record.
        const { inviteId, link } = await owner.inviteMember(ownerDoc, { role: 'editor' });

        // The at-rest bytes must be CIPHERTEXT — not the plaintext JSON record (which would parse + carry sMacClaim).
        const storedBytes = await readIdbSnapshot(`invite-mint::${inviteId}`);
        const asText = new TextDecoder().decode(new Uint8Array(storedBytes ?? []));
        let looksPlaintext = false;
        try { looksPlaintext = Object.hasOwn(JSON.parse(asText), 'sMacClaim'); } catch { looksPlaintext = false; }

        // Member provisions an account, builds a claim from the link; owner admits → OPENS the sealed record.
        const member = spawnWorker(`${memberDoc}:member`);
        await member.warm();
        await member.clearPersisted(memberDoc);
        const acct = await member.provisionMember(memberPass);
        const parsed = parseLink(link);
        const claimObj = await buildClaim({
          s: parsed.s, inviteId, uuid: ownerDoc, role: 'editor',
          memberId: acct.memberId, hpkePublicKey: acct.hpkePublicKey, authorPublicKey: acct.authorPublicKey,
        });
        let admitted = false; let admitError = null;
        try {
          await owner.admitMember(ownerDoc, {
            passphrase: ownerPass, treeId, ownerMemberId: 'acct-owner', inviteId, claim: claimObj,
          });
          admitted = true;
        } catch (e) { admitError = String(e?.cause ?? e?.message ?? e); }

        return { storedByteLen: storedBytes?.length ?? 0, looksPlaintext, admitted, admitError };
      },

      // Editor propose → maintainer approve through the real worker (OPE-360): an owner shares a tree with an
      // EDITOR, who cannot commit directly (a delta needs Maintainer) so mints + PROPOSES. The owner lists the
      // pending proposal, approves it (verify → commit as an attributed delta → delete → sync), and a second
      // proposal is REJECTED. Proves the whole App wiring: worker propose/approve/reject over the transport's
      // proposals channel, attribution preserved (createdBy = the editor), and reject discards without committing.
      async proposeApprove() {
        const transport = makeTransport();
        const treeId = new Uint8Array(16).fill(9);
        const ownerDoc = `prop-owner-${crypto.randomUUID()}`;
        const memberDoc = `prop-member-${crypto.randomUUID()}`;
        const ownerPass = 'owner passphrase here';
        const memberPass = 'member passphrase here';

        // Owner provisions + shares the tree with an editor; the editor joins via the genesis-walk.
        const owner = spawnWorker(`${ownerDoc}:owner`);
        await owner.warm();
        await owner.clearPersisted(ownerDoc);
        await provisionTree(owner, { passphrase: ownerPass, treeId, docId: ownerDoc });
        await owner.attachTransport(ownerDoc, Comlink.proxy(transport));
        const pin = await owner.keyringHash(ownerDoc);

        const member = spawnWorker(`${memberDoc}:member`);
        await member.warm();
        await member.clearPersisted(memberDoc);
        const acct = await member.provisionMember(memberPass);
        await owner.addMember(ownerDoc, {
          passphrase: ownerPass, treeId, ownerMemberId: 'acct-owner', minRevision: 1,
          newMemberId: acct.memberId, role: 'editor',
          memberAuthorPublic: acct.authorPublicKey, memberHpkePublic: acct.hpkePublicKey,
        });

        await member.attachTransport(memberDoc, Comlink.proxy(transport));
        const joined = await member.joinAsMember({
          treeId, docId: memberDoc, passphrase: memberPass, memberId: acct.memberId,
          pinnedRevision: pin.revision, pinnedHash: pin.hash,
        });
        await member.syncNow(memberDoc); // pull the shared base

        // The editor mints a claim and SUBMITS it — the write-side role pre-check routes an editor to a
        // PROPOSAL (they cannot commit — a delta needs Maintainer).
        await member.assertAnchor(memberDoc, 'pByEditor', PERSON);
        await member.assertClaim(memberDoc, 'pByEditor', NAME, nameJson('Grace'));
        const editorCanCommit = await member.canCommitDirectly(memberDoc);
        const editorRoute = await member.submitEdit(memberDoc); // { proposed: true, proposal }
        const proposed = editorRoute.proposal;

        // The owner reviews the queue and APPROVES it → committed as an attributed delta, then deleted.
        const ownerCanCommit = await owner.canCommitDirectly(ownerDoc);
        const pending = await owner.pendingProposals(ownerDoc);
        const committed = await owner.approveProposal(ownerDoc, pending[0].id);
        const afterApprove = await owner.pendingProposals(ownerDoc); // emptied by the delete
        const anchor = JSON.parse(await owner.liveRecords(ownerDoc)).find((r) => r.id === 'pByEditor');

        // A SECOND proposal the owner REJECTS — discarded without committing.
        await member.assertAnchor(memberDoc, 'pRejected', PERSON);
        const rejected = await member.proposeEdit(memberDoc);
        await owner.rejectProposal(ownerDoc, rejected.id);
        const afterReject = await owner.pendingProposals(ownerDoc);

        // The OWNER submits an edit — the pre-check routes a maintainer to a DIRECT commit.
        await owner.assertAnchor(ownerDoc, 'pByOwner', PERSON);
        const ownerRoute = await owner.submitEdit(ownerDoc); // { committed: true }
        const ownerPeopleFinal = JSON.parse(await owner.project(ownerDoc)).people.map((p) => p.id);

        return {
          proposedId: proposed?.id ?? null,
          editorCanCommit,
          editorRouted: editorRoute.proposed === true,
          ownerCanCommit,
          ownerCommitted: ownerRoute.committed === true,
          pendingCount: pending.length,
          committed,
          afterApproveCount: afterApprove.length,
          anchorCreatedBy: anchor?.createdBy ?? null,
          editorDid: joined.didKey,
          rejectedId: rejected?.id ?? null,
          afterRejectCount: afterReject.length,
          ownerPeopleFinal,
        };
      },

      // First-share base seal (OPE-360 §5): can a joining member see the owner's PRE-share (solo-era, unsigned)
      // history? The owner builds a tree SOLO, then shares. A solo owner's deltas are unsigned; on the now-shared
      // tree a member rejects the raw deltas (shared + unattributed → Reject), so the pre-share state is carried
      // across ONLY by the owner's member-signed base snapshot (sealed at first share, after folding the owner's
      // own trusted history). Also checks the owner keeps their own tree through the transition. chain AND dag.
      async preShareVisibility(engine) {
        const transport = makeTransport();
        const treeId = new Uint8Array(16).fill(engine === 'dag' ? 11 : 12);
        const ownerDoc = `pre-owner-${crypto.randomUUID()}`;
        const memberDoc = `pre-member-${crypto.randomUUID()}`;
        const ownerPass = 'owner passphrase here';
        const memberPass = 'member passphrase here';

        const owner = spawnWorker(`${ownerDoc}:owner`);
        await owner.warm();
        await owner.clearPersisted(ownerDoc);
        await provisionTree(owner, { passphrase: ownerPass, treeId, docId: ownerDoc, engine });
        await owner.attachTransport(ownerDoc, Comlink.proxy(transport));
        const chainPin = engine === 'chain' ? await owner.keyringHash(ownerDoc) : null; // pin genesis before the add

        // PRE-SHARE: the owner builds their tree while SOLO — these deltas are unsigned (solo era) — and pushes them.
        await owner.assertAnchor(ownerDoc, 'pPreShare', PERSON);
        await owner.assertClaim(ownerDoc, 'pPreShare', NAME, nameJson('Ada'));
        await owner.commit(ownerDoc);
        await owner.syncNow(ownerDoc);

        // Owner SHARES with a maintainer — the first-share base seal fires inside addMember.
        const member = spawnWorker(`${memberDoc}:member`);
        await member.warm();
        await member.clearPersisted(memberDoc);
        const acct = await member.provisionMember(memberPass);
        await owner.addMember(ownerDoc, {
          passphrase: ownerPass, treeId, ownerMemberId: 'acct-owner',
          newMemberId: acct.memberId, role: 'maintainer',
          memberAuthorPublic: acct.authorPublicKey, memberHpkePublic: acct.hpkePublicKey, engine,
        });
        const dagPin = engine === 'dag' ? await owner.dagAnchorPin(ownerDoc) : null;
        const snapAfterShare = transport._hasSnapshot(); // the first-share base seal pushed a signed snapshot
        // The OWNER must still see their own pre-share history after the solo→shared re-fold (it is not dropped).
        const ownerSeesAfterShare = JSON.parse(await owner.project(ownerDoc)).people.map((p) => p.id);

        // Member JOINS and syncs — does it see the owner's pre-share history?
        await member.attachTransport(memberDoc, Comlink.proxy(transport));
        await member.joinAsMember(
          engine === 'dag'
            ? { engine, treeId, docId: memberDoc, passphrase: memberPass, memberId: acct.memberId, pin: dagPin }
            : { engine, treeId, docId: memberDoc, passphrase: memberPass, memberId: acct.memberId, pinnedRevision: chainPin.revision, pinnedHash: chainPin.hash },
        );
        await member.syncNow(memberDoc);
        const proj = JSON.parse(await member.project(memberDoc)).people;
        return {
          engine,
          snapAfterShare,
          ownerSeesAfterShare,
          memberSees: proj.map((p) => p.id),
          sawPreShare: proj.some((p) => p.id === 'pPreShare'),
          preShareNames: proj.find((p) => p.id === 'pPreShare')?.names?.length ?? 0,
        };
      },

      // Change-history read (OPE-463): a device mints + commits, pushes the delta, then history() fetches the
      // feed and DECRYPTS each delta through the core — returning per-change records the UI renders directly.
      async changeHistory() {
        const transport = makeTransport();
        const a = await openDevice(spawnWorker(), 0xc1, transport);
        await a.assertAnchor(DOC, 'pA', PERSON);
        await a.assertClaim(DOC, 'pA', NAME, nameJson('Ada'));
        await a.commit(DOC);
        await a.syncNow(DOC); // push the delta

        const hist = await a.history(DOC);
        const ops = hist.entries.flatMap((e) => e.ops ?? []);
        return {
          count: hist.entries.length,
          allViewable: hist.entries.every((e) => e.viewable),
          author: hist.entries[0]?.author ?? null,
          ids: ops.map((it) => it.id).filter(Boolean),
        };
      },

      // THE removeMember lifecycle through the real worker (chain): an owner shares a tree, a member joins and
      // sees the shared write, then the owner REMOVES the member — rotating the keyring (a forward-secret
      // re-epoch), re-unlocking the owner under the new epoch, and publishing the rotated revision. Proves live:
      // the rotation is published, the re-unlocked owner still writes a signed entry that syncs, and the removed
      // member is cryptographically locked out (a fresh join at the rotated head fails). Chain retains history,
      // so no self-heal cover is authored here (that path is dag-only, proven in Rust) — authorCover is a no-op.
      async shareRemoveLockout() {
        const transport = makeTransport();
        const treeId = new Uint8Array(16).fill(4);
        const ownerDoc = `rm-owner-${crypto.randomUUID()}`;
        const memberDoc = `rm-member-${crypto.randomUUID()}`;
        const rejoinDoc = `rm-rejoin-${crypto.randomUUID()}`;
        const ownerPass = 'owner passphrase here';
        const memberPass = 'member passphrase here';

        // Owner provisions the tree + mints the invite pin; member mints an account; owner admits them.
        const owner = spawnWorker(`${ownerDoc}:owner`);
        await owner.warm();
        await owner.clearPersisted(ownerDoc);
        const ownerProv = await provisionTree(owner, { passphrase: ownerPass, treeId, docId: ownerDoc });
        await owner.attachTransport(ownerDoc, Comlink.proxy(transport));
        const pin = await owner.keyringHash(ownerDoc);

        const member = spawnWorker(`${memberDoc}:member`);
        await member.warm();
        await member.clearPersisted(memberDoc);
        const acct = await member.provisionMember(memberPass);
        await owner.addMember(ownerDoc, {
          passphrase: ownerPass, treeId, ownerMemberId: 'acct-owner', minRevision: 1,
          newMemberId: acct.memberId, role: 'editor',
          memberAuthorPublic: acct.authorPublicKey, memberHpkePublic: acct.hpkePublicKey,
        });

        // Owner writes a signed entry; the member joins via the genesis-walk and sees it.
        await owner.assertAnchor(ownerDoc, 'pShared', PERSON);
        await owner.commit(ownerDoc);
        await owner.syncNow(ownerDoc);
        await member.attachTransport(memberDoc, Comlink.proxy(transport));
        await member.joinAsMember({
          treeId, docId: memberDoc, passphrase: memberPass, memberId: acct.memberId,
          pinnedRevision: pin.revision, pinnedHash: pin.hash,
        });
        await member.syncNow(memberDoc);
        const beforeRemoval = JSON.parse(await member.project(memberDoc)).people.map((p) => p.id);
        const headBefore = (await transport.readKeyring(ownerDoc, 1)).head; // rev 2 (genesis + add)

        // OWNER REMOVES the member: rotate the keyring, re-unlock the owner under the new epoch, publish rev 3.
        await owner.removeMember(ownerDoc, {
          passphrase: ownerPass, treeId, ownerMemberId: 'acct-owner', minRevision: 2, removeMemberId: acct.memberId,
        });
        const headAfter = (await transport.readKeyring(ownerDoc, 1)).head; // rev 3 (after the remove)

        // The re-unlocked owner still signs: write a POST-removal entry and push it.
        await owner.assertAnchor(ownerDoc, 'pAfter', PERSON);
        await owner.commit(ownerDoc);
        const push = await owner.syncNow(ownerDoc);
        const ownerAfter = JSON.parse(await owner.project(ownerDoc)).people.map((p) => p.id);

        // A REMOVED member is locked out: a fresh worker with the member's account can no longer join the
        // rotated tree (the walk is valid, but the member is absent from the head membership → unlock fails).
        const rejoin = spawnWorker(`${memberDoc}:member`);
        await rejoin.warm();
        await rejoin.clearPersisted(rejoinDoc);
        await rejoin.attachTransport(rejoinDoc, Comlink.proxy(transport));
        let lockedOut = false;
        try {
          await rejoin.joinAsMember({
            treeId, docId: rejoinDoc, passphrase: memberPass, memberId: acct.memberId,
            pinnedRevision: pin.revision, pinnedHash: pin.hash,
          });
        } catch {
          lockedOut = true;
        }

        return {
          beforeRemoval, headBefore, headAfter, pushState: push.state, ownerAfter, lockedOut,
          // OPE-293: the owner's removeMember asserted the rotated membership to /access — the removed member
          // is dropped from the advisory view, the owner remains.
          accessAfterRemoval: transport._access(),
          // OPE-543 self-cert ids: what /access must (owner) and must not (removed member) carry.
          ownerMemberId: ownerProv.memberId,
          memberMemberId: acct.memberId,
        };
      },

      // SLICE 3 (OPE-421) compact-before-remove, chain: a Maintainer member writes a data delta; the owner
      // removes them, which pulls + pins the member's folded history into an owner-authored snapshot BEFORE the
      // rotation. Then a COLD reload of the owner (fresh worker, same IndexedDB, NO transport) re-judges the
      // whole local log under the post-removal head — where the member is ABSENT, so the delta look-behind
      // would Drop 'pMemberWrite' — and must still project it, recovered from the pin. Without compact-before-
      // remove the owner would never have pulled it, so its presence after a pure local reload proves Slice 3.
      async chainRemovePreservesHistory() {
        const transport = makeTransport();
        const treeId = new Uint8Array(16).fill(7);
        const ownerDoc = `pres-owner-${crypto.randomUUID()}`;
        const memberDoc = `pres-member-${crypto.randomUUID()}`;
        const ownerPass = 'owner passphrase here';
        const memberPass = 'member passphrase here';

        const owner = spawnWorker(`${ownerDoc}:owner`);
        await owner.warm();
        await owner.clearPersisted(ownerDoc);
        await provisionTree(owner, { passphrase: ownerPass, treeId, docId: ownerDoc });
        await owner.attachTransport(ownerDoc, Comlink.proxy(transport));
        const pin = await owner.keyringHash(ownerDoc);

        // Admit the member as a MAINTAINER so they can commit data deltas.
        const member = spawnWorker(`${memberDoc}:member`);
        await member.warm();
        await member.clearPersisted(memberDoc);
        const acct = await member.provisionMember(memberPass);
        await owner.addMember(ownerDoc, {
          passphrase: ownerPass, treeId, ownerMemberId: 'acct-owner', minRevision: 1,
          newMemberId: acct.memberId, role: 'maintainer',
          memberAuthorPublic: acct.authorPublicKey, memberHpkePublic: acct.hpkePublicKey,
        });

        // Member joins (genesis-walk) and commits a data delta, syncing it to the remote.
        await member.attachTransport(memberDoc, Comlink.proxy(transport));
        await member.joinAsMember({
          treeId, docId: memberDoc, passphrase: memberPass, memberId: acct.memberId,
          pinnedRevision: pin.revision, pinnedHash: pin.hash,
        });
        await member.assertAnchor(memberDoc, 'pMemberWrite', PERSON);
        await member.commit(memberDoc);
        await member.syncNow(memberDoc);

        // Owner removes the member: compact-before-remove pulls 'pMemberWrite' + pins it under the pre-removal
        // epoch, THEN rotates.
        await owner.removeMember(ownerDoc, {
          passphrase: ownerPass, treeId, ownerMemberId: 'acct-owner', minRevision: 2, removeMemberId: acct.memberId,
        });
        const ownerLiveSees = JSON.parse(await owner.project(ownerDoc)).people.map((p) => p.id);

        // COLD reload of the owner — fresh worker, NO transport, pure local hydrate + bootstrap under the
        // post-removal head.
        const reloaded = spawnWorker(`${ownerDoc}:owner`);
        await reloaded.warm();
        await openTree(reloaded, { passphrase: ownerPass, treeId, docId: ownerDoc });
        const seenAfterReload = JSON.parse(await reloaded.project(ownerDoc)).people.map((p) => p.id);

        return { ownerLiveSees, seenAfterReload };
      },

      // OPE-426 opt-in soft removal, end to end through the worker: a co-owner writes a TRAILING edit around
      // their demotion (their local core hasn't synced the demotion, so it seals as co-owner); the owner pulls
      // it under the post-demote head, where the look-behind DROPS it into the pending-review queue. The owner
      // then APPROVES it — vouching → folding → pinning — and it is projected live AND survives a cold reload.
      // (The in-page transport is a dumb store with no server ACL, i.e. the BYO case where the server gate
      // isn't the backstop and the client-side review is the mechanism.)
      async softRemovalApprove() {
        const transport = makeTransport();
        const treeId = new Uint8Array(16).fill(11);
        const ownerDoc = `soft-owner-${crypto.randomUUID()}`;
        const memberDoc = `soft-member-${crypto.randomUUID()}`;
        const ownerPass = 'owner passphrase here';
        const memberPass = 'member passphrase here';

        const owner = spawnWorker(`${ownerDoc}:owner`);
        await owner.warm();
        await owner.clearPersisted(ownerDoc);
        await provisionTree(owner, { passphrase: ownerPass, treeId, docId: ownerDoc });
        await owner.attachTransport(ownerDoc, Comlink.proxy(transport));
        const pin = await owner.keyringHash(ownerDoc);

        const member = spawnWorker(`${memberDoc}:member`);
        await member.warm();
        await member.clearPersisted(memberDoc);
        const acct = await member.provisionMember(memberPass);
        await owner.addMember(ownerDoc, {
          passphrase: ownerPass, treeId, ownerMemberId: 'acct-owner', minRevision: 1,
          newMemberId: acct.memberId, role: 'editor',
          memberAuthorPublic: acct.authorPublicKey, memberHpkePublic: acct.hpkePublicKey,
        });
        await owner.changeRole(ownerDoc, {
          passphrase: ownerPass, treeId, ownerMemberId: 'acct-owner', targetMemberId: acct.memberId, newRole: 'co-owner',
        });

        // Member joins as co-owner. It does NOT sync again, so it stays co-owner locally through the write below.
        await member.attachTransport(memberDoc, Comlink.proxy(transport));
        await member.joinAsMember({
          treeId, docId: memberDoc, passphrase: memberPass, memberId: acct.memberId,
          pinnedRevision: pin.revision, pinnedHash: pin.hash,
        });

        // Owner DEMOTES the co-owner to editor.
        await owner.changeRole(ownerDoc, {
          passphrase: ownerPass, treeId, ownerMemberId: 'acct-owner', targetMemberId: acct.memberId, newRole: 'editor',
        });

        // The member (still co-owner LOCALLY) writes a trailing edit and pushes it (the dumb store accepts it).
        await member.assertAnchor(memberDoc, 'pLate', PERSON);
        await member.commit(memberDoc);
        await member.syncNow(memberDoc);

        // Owner pulls it under the post-demote head → the look-behind DROPS it into the pending queue.
        await owner.syncNow(ownerDoc);
        const pending = await owner.pendingReviews(ownerDoc);
        const liveBeforeApprove = JSON.parse(await owner.project(ownerDoc)).people.map((p) => p.id);

        // Owner APPROVES every pending trailing edit → folded + pinned.
        let approvedAny = false;
        for (const p of pending) {
          if (await owner.approvePending(ownerDoc, { replica: p.replica, counter: p.counter })) approvedAny = true;
        }
        const liveAfterApprove = JSON.parse(await owner.project(ownerDoc)).people.map((p) => p.id);

        // Cold reload: the approved edit survives (recovered from the pin).
        const reloaded = spawnWorker(`${ownerDoc}:owner`);
        await reloaded.warm();
        await openTree(reloaded, { passphrase: ownerPass, treeId, docId: ownerDoc });
        const seenAfterReload = JSON.parse(await reloaded.project(ownerDoc)).people.map((p) => p.id);

        return {
          pendingAuthors: pending.map((p) => p.authorMemberId),
          memberMemberId: acct.memberId, // OPE-543: the demoted member's self-cert id (queue attribution)
          liveBeforeApprove, approvedAny, liveAfterApprove, seenAfterReload,
        };
      },

      // THE dag distribution loop through the real worker: an owner provisions a DAG tree, admits a member,
      // and the member JOINS by verifying a self-contained anchor against an OOB pin (no per-revision walk) —
      // then verify-on-ingest accepts the owner's signed write AND the member's own maintainer write across
      // the pull. A wrong pin is refused. Finally a removeMember rotates + republishes the anchor and authors
      // the self-heal cover, pushing it to the data channel (the cover's covered-accept READER is proven in
      // Rust — SH-3; the browser proves the dag join/publish/sync/verify wiring + the live cover trigger).
      async shareVerifyDag() {
        const transport = makeTransport();
        const treeId = new Uint8Array(16).fill(6);
        const ownerDoc = `dag-owner-${crypto.randomUUID()}`;
        const memberDoc = `dag-member-${crypto.randomUUID()}`;
        const badDoc = `dag-bad-${crypto.randomUUID()}`;
        const ownerPass = 'owner passphrase here';
        const memberPass = 'member passphrase here';

        // Owner provisions a DAG tree, mints a member account, admits it as a Maintainer (so it can commit).
        const owner = spawnWorker(`${ownerDoc}:owner`);
        await owner.warm();
        await owner.clearPersisted(ownerDoc);
        await provisionTree(owner, { passphrase: ownerPass, treeId, docId: ownerDoc, engine: 'dag' });
        await owner.attachTransport(ownerDoc, Comlink.proxy(transport));

        const member = spawnWorker(`${memberDoc}:member`);
        await member.warm();
        await member.clearPersisted(memberDoc);
        const acct = await member.provisionMember(memberPass);
        await owner.addMember(ownerDoc, {
          passphrase: ownerPass, treeId, ownerMemberId: 'acct-owner',
          newMemberId: acct.memberId, role: 'maintainer',
          memberAuthorPublic: acct.authorPublicKey, memberHpkePublic: acct.hpkePublicKey, engine: 'dag',
        });
        const pin = await owner.dagAnchorPin(ownerDoc); // the OOB trust pin (post-add anchor)

        // Owner writes a signed entry and pushes it.
        await owner.assertAnchor(ownerDoc, 'pShared', PERSON);
        await owner.commit(ownerDoc);
        await owner.syncNow(ownerDoc);

        // A WRONG pin is refused (the trust gate): flip a byte of the pin → the join must throw.
        const badPin = new Uint8Array(pin); badPin[0] ^= 0xff;
        const bad = spawnWorker(`${memberDoc}:member`);
        await bad.warm();
        await bad.clearPersisted(badDoc);
        await bad.attachTransport(badDoc, Comlink.proxy(transport));
        let wrongPinRejected = false;
        try {
          await bad.joinAsMember({
            engine: 'dag', treeId, docId: badDoc, passphrase: memberPass, memberId: acct.memberId,
            pin: badPin,
          });
        } catch { wrongPinRejected = true; }

        // The member JOINS with the right pin, syncs, and sees the owner's signed write.
        await member.attachTransport(memberDoc, Comlink.proxy(transport));
        const joined = await member.joinAsMember({
          engine: 'dag', treeId, docId: memberDoc, passphrase: memberPass, memberId: acct.memberId,
          pin,
        });
        await member.syncNow(memberDoc);
        const memberSees = JSON.parse(await member.project(memberDoc)).people.map((p) => p.id);

        // The member writes its OWN maintainer entry; the owner pulls it and verify-on-ingest accepts it.
        await member.assertAnchor(memberDoc, 'pMember', PERSON);
        await member.commit(memberDoc);
        await member.syncNow(memberDoc);
        await owner.syncNow(ownerDoc);
        const ownerSees = JSON.parse(await owner.project(ownerDoc)).people.map((p) => p.id);

        // Owner REMOVES the member: rotate + republish the anchor, and author + push the self-heal cover over
        // the member's now-removed history. The data channel grows by exactly the cover.
        const keyringHeadBefore = (await transport.readKeyring(ownerDoc, 1)).head;
        const dataBefore = transport._size();
        await owner.removeMember(ownerDoc, {
          passphrase: ownerPass, treeId, ownerMemberId: 'acct-owner', removeMemberId: acct.memberId, engine: 'dag',
        });
        const keyringHeadAfter = (await transport.readKeyring(ownerDoc, 1)).head;
        const dataAfter = transport._size();

        return {
          joinedDid: joined.didKey,
          memberSees,
          ownerSees,
          wrongPinRejected,
          keyringGrew: keyringHeadAfter > keyringHeadBefore,
          coverPushed: dataAfter - dataBefore,
        };
      },

      // Co-owner promote/demote through the worker on the DAG (OPE-364): the owner admits a member as an
      // editor, PROMOTES them to co-owner, then DEMOTES them back to editor — each role asserted via the
      // advisory /access view the worker pushes. Exercises the full changeRole stack end to end (worker → wasm
      // → vault → dag_client → the StrongDemote-aware resolver).
      async shareChangeRoleDag() {
        const transport = makeTransport();
        const treeId = new Uint8Array(16).fill(9);
        const ownerDoc = `cr-owner-${crypto.randomUUID()}`;
        const memberDoc = `cr-member-${crypto.randomUUID()}`;
        const ownerPass = 'owner passphrase here';
        const memberPass = 'member passphrase here';

        const owner = spawnWorker(`${ownerDoc}:owner`);
        await owner.warm();
        await owner.clearPersisted(ownerDoc);
        await provisionTree(owner, { passphrase: ownerPass, treeId, docId: ownerDoc, engine: 'dag' });
        await owner.attachTransport(ownerDoc, Comlink.proxy(transport));

        const member = spawnWorker(`${memberDoc}:member`);
        await member.warm();
        await member.clearPersisted(memberDoc);
        const acct = await member.provisionMember(memberPass);
        await owner.addMember(ownerDoc, {
          passphrase: ownerPass, treeId, ownerMemberId: 'acct-owner', newMemberId: acct.memberId, role: 'editor',
          memberAuthorPublic: acct.authorPublicKey, memberHpkePublic: acct.hpkePublicKey, engine: 'dag',
        });
        const roleOf = (id) => transport._access()?.members.find((m) => m.memberId === id)?.role;
        const afterAdd = roleOf(acct.memberId);

        await owner.changeRole(ownerDoc, {
          passphrase: ownerPass, treeId, ownerMemberId: 'acct-owner', targetMemberId: acct.memberId, newRole: 'co-owner', engine: 'dag',
        });
        const afterPromote = roleOf(acct.memberId);

        await owner.changeRole(ownerDoc, {
          passphrase: ownerPass, treeId, ownerMemberId: 'acct-owner', targetMemberId: acct.memberId, newRole: 'editor', engine: 'dag',
        });
        const afterDemote = roleOf(acct.memberId);

        return { afterAdd, afterPromote, afterDemote, present: roleOf(acct.memberId) != null };
      },

      // SLICE 3 (OPE-421) chain co-owner DEMOTE through the worker — no longer refused. An owner admits a
      // member, promotes them to co-owner (so they can commit), the member writes a delta, then the owner
      // DEMOTES them back to editor. Proves: (a) the advisory role round-trips co-owner → editor; (b)
      // compact-before-demote preserves the demoted member's pre-demote commit across a COLD owner reload (the
      // look-behind would otherwise Drop it, their head role now being Editor < Maintainer for a Delta).
      async shareChangeRoleChain() {
        const transport = makeTransport();
        const treeId = new Uint8Array(16).fill(10);
        const ownerDoc = `crc-owner-${crypto.randomUUID()}`;
        const memberDoc = `crc-member-${crypto.randomUUID()}`;
        const ownerPass = 'owner passphrase here';
        const memberPass = 'member passphrase here';

        const owner = spawnWorker(`${ownerDoc}:owner`);
        await owner.warm();
        await owner.clearPersisted(ownerDoc);
        await provisionTree(owner, { passphrase: ownerPass, treeId, docId: ownerDoc });
        await owner.attachTransport(ownerDoc, Comlink.proxy(transport));
        const pin = await owner.keyringHash(ownerDoc); // rev 1

        const member = spawnWorker(`${memberDoc}:member`);
        await member.warm();
        await member.clearPersisted(memberDoc);
        const acct = await member.provisionMember(memberPass);
        await owner.addMember(ownerDoc, {
          passphrase: ownerPass, treeId, ownerMemberId: 'acct-owner', minRevision: 1,
          newMemberId: acct.memberId, role: 'editor',
          memberAuthorPublic: acct.authorPublicKey, memberHpkePublic: acct.hpkePublicKey,
        });
        const roleOf = (id) => transport._access()?.members.find((m) => m.memberId === id)?.role;
        // Promote to co-owner so the member can commit data deltas.
        await owner.changeRole(ownerDoc, {
          passphrase: ownerPass, treeId, ownerMemberId: 'acct-owner', targetMemberId: acct.memberId, newRole: 'co-owner',
        });
        const afterPromote = roleOf(acct.memberId);

        // The member joins (now a co-owner in the keyring) and commits a delta, syncing it to the remote.
        await member.attachTransport(memberDoc, Comlink.proxy(transport));
        await member.joinAsMember({
          treeId, docId: memberDoc, passphrase: memberPass, memberId: acct.memberId,
          pinnedRevision: pin.revision, pinnedHash: pin.hash,
        });
        await member.assertAnchor(memberDoc, 'pMemberWrite', PERSON);
        await member.commit(memberDoc);
        await member.syncNow(memberDoc);

        // Owner DEMOTES the co-owner to editor (chain) — compact-before-demote pins their write first.
        await owner.changeRole(ownerDoc, {
          passphrase: ownerPass, treeId, ownerMemberId: 'acct-owner', targetMemberId: acct.memberId, newRole: 'editor',
        });
        const afterDemote = roleOf(acct.memberId);

        // Cold reload of the owner: the demoted member's pre-demote commit survives (recovered from the pin).
        const reloaded = spawnWorker(`${ownerDoc}:owner`);
        await reloaded.warm();
        await openTree(reloaded, { passphrase: ownerPass, treeId, docId: ownerDoc });
        const seenAfterReload = JSON.parse(await reloaded.project(ownerDoc)).people.map((p) => p.id);

        return { afterPromote, afterDemote, present: roleOf(acct.memberId) != null, seenAfterReload };
      },

      // THE dag self-heal, end to end through the worker (OPE-382 + OPE-393): an owner admits TWO maintainers
      // (bob + carol), bob writes, the owner removes bob — authoring a cover under the NEW (post-removal) epoch
      // — and carol, a REMAINING member, syncs: she adopts the rotated epoch (so she can open the cover) and
      // covered-accepts bob's now-removed history. Proves the cover's covered-accept READER live in a browser,
      // which needs the OPE-393 epoch adopt-on-sync (without it carol couldn't decrypt the new-epoch cover).
      async dagSelfHealCoveredAccept() {
        const transport = makeTransport();
        const treeId = new Uint8Array(16).fill(8);
        const ownerDoc = `sh-owner-${crypto.randomUUID()}`;
        const bobDoc = `sh-bob-${crypto.randomUUID()}`;
        const carolDoc = `sh-carol-${crypto.randomUUID()}`;
        const ownerPass = 'owner passphrase here';
        const bobPass = 'bob passphrase here';
        const carolPass = 'carol passphrase here';

        // Owner provisions a dag tree and admits bob + carol, both Maintainers (so they commit deltas).
        const owner = spawnWorker(`${ownerDoc}:owner`);
        await owner.warm();
        await owner.clearPersisted(ownerDoc);
        await provisionTree(owner, { passphrase: ownerPass, treeId, docId: ownerDoc, engine: 'dag' });
        await owner.attachTransport(ownerDoc, Comlink.proxy(transport));

        const bob = spawnWorker(`${bobDoc}:bob`); await bob.warm(); await bob.clearPersisted(bobDoc);
        const bobAcct = await bob.provisionMember(bobPass);
        const carol = spawnWorker(`${carolDoc}:carol`); await carol.warm(); await carol.clearPersisted(carolDoc);
        const carolAcct = await carol.provisionMember(carolPass);

        await owner.addMember(ownerDoc, {
          passphrase: ownerPass, treeId, ownerMemberId: 'acct-owner', newMemberId: bobAcct.memberId, role: 'maintainer',
          memberAuthorPublic: bobAcct.authorPublicKey, memberHpkePublic: bobAcct.hpkePublicKey, engine: 'dag',
        });
        await owner.addMember(ownerDoc, {
          passphrase: ownerPass, treeId, ownerMemberId: 'acct-owner', newMemberId: carolAcct.memberId, role: 'maintainer',
          memberAuthorPublic: carolAcct.authorPublicKey, memberHpkePublic: carolAcct.hpkePublicKey, engine: 'dag',
        });
        const pin = await owner.dagAnchorPin(ownerDoc); // one pin over the anchor with BOTH members

        // bob + carol join. They share the current epoch, so carol can later decrypt bob's write.
        await bob.attachTransport(bobDoc, Comlink.proxy(transport));
        await bob.joinAsMember({ engine: 'dag', treeId, docId: bobDoc, passphrase: bobPass, memberId: bobAcct.memberId, pin });
        await carol.attachTransport(carolDoc, Comlink.proxy(transport));
        await carol.joinAsMember({ engine: 'dag', treeId, docId: carolDoc, passphrase: carolPass, memberId: carolAcct.memberId, pin });

        // bob writes a signed entry and pushes it; the owner pulls it (so its store holds bob's entry to cover).
        await bob.assertAnchor(bobDoc, 'pBob', PERSON);
        await bob.commit(bobDoc);
        await bob.syncNow(bobDoc);
        await owner.syncNow(ownerDoc);

        // Carol has NOT synced data yet — she will first see pBob only AFTER bob's removal, so the covered-accept
        // path (not a normal-member accept) is what admits it.
        const carolBeforeRemoval = JSON.parse(await carol.project(carolDoc)).people.map((p) => p.id);

        // Owner REMOVES bob: forward-secret re-epoch, author + push the self-heal cover (under the new epoch),
        // publish the rotated anchor.
        await owner.removeMember(ownerDoc, { passphrase: ownerPass, treeId, ownerMemberId: 'acct-owner', removeMemberId: bobAcct.memberId, engine: 'dag' });

        // Carol syncs: keyring-before-data adopts the rotated anchor (bob removed) + ADOPTS the new epoch DEK,
        // then pulls the data — bob's pBob (old epoch, held since join) + the cover (new epoch, just adopted).
        // Her rotated resolver sees bob as removed-but-ever-member → she covered-accepts pBob.
        const carolSync = await carol.syncNow(carolDoc);
        const carolAfter = JSON.parse(await carol.project(carolDoc)).people.map((p) => p.id);

        return {
          carolBeforeRemoval,
          carolAfter,
          carolSyncState: carolSync.state,
          carolAnomalies: carolSync.anomalies,
        };
      },

      // reset() clears the tree + durable store, so a demo reseed replaces rather than piles up.
      async reseedClears() {
        const doc = 'reseed-e2e';
        const w = spawnWorker();
        await w.warm();
        await w.clearPersisted(doc);
        await w.openDev(new Uint8Array(16).fill(5), new Uint8Array(8).fill(0xc3), DID, doc, true);
        await w.assertAnchor(doc, 'pOld', PERSON);
        await w.commit(doc);
        const before = JSON.parse(await w.project(doc));
        await w.resetCore(doc);
        const cleared = JSON.parse(await w.project(doc));
        await w.assertAnchor(doc, 'pNew', PERSON);
        await w.commit(doc);
        const after = JSON.parse(await w.project(doc));
        return {
          beforeIds: before.people.map((p) => p.id),
          clearedIds: cleared.people.map((p) => p.id),
          afterIds: after.people.map((p) => p.id),
        };
      },
    };

    document.getElementById('status').textContent = 'ready';
    window.__ready = true;
  </script>
</body>
