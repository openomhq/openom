name: staging.web

# Manual or orchestrated staging web deployment. Static/WASM build receives no staging environment or credentials;
# deployment injects public runtime configuration and publishes the verified artifact; browser
# acceptance receives only the dedicated test-account credentials.
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: staging.web
  cancel-in-progress: false

permissions:
  contents: read

env:
  API_URL: https://api.staging.openom.org
  SITE_URL: https://app.staging.openom.org/
  PAGES_PROJECT: openom-staging-web

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: 24.11.0

      - name: Build the app-core WASM
        run: node scripts/build/build-app-core.mjs

      - name: Assemble and hash the static site
        run: |
          set -euo pipefail
          mkdir -p _site/functions _artifact
          cp -r apps/app/. _site/
          cp -r assets _site/assets
          cp apps/staging-gate/_middleware.js _site/functions/_middleware.js
          tar -czf _artifact/site.tar.gz -C _site .
          (cd _artifact && sha256sum site.tar.gz > SHA256SUMS)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-web-${{ github.sha }}
          path: _artifact/
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: 24.11.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: staging-web-${{ github.sha }}
          path: _artifact

      - name: Verify staging deployment configuration
        env:
          CLOUDFLARE_PAGES_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          STAGING_APP_GATE_PASSWORD: ${{ secrets.STAGING_APP_GATE_PASSWORD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: node infra/deployment/deployment-config.mjs --validate-job staging.web.deploy

      - name: Verify and extract the static artifact
        run: |
          set -euo pipefail
          (cd _artifact && sha256sum -c SHA256SUMS)
          mkdir _site
          tar -xzf _artifact/site.tar.gz -C _site

      - name: Substitute public runtime configuration
        working-directory: apps
        env:
          SITE_URL: ${{ env.SITE_URL }}
          OPENOM_LANDING: live
          OPENOM_SERVER: ${{ env.API_URL }}
          OPENOM_AUTH_PROVIDER: supabase
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/site-url.mjs ../_site

      - name: Write security and cache headers
        env:
          R2: ${{ vars.R2_ENDPOINT }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: |
          cat > _site/_headers <<EOF
          /*
            Content-Security-Policy: default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' ${API_URL} ${SUPABASE_URL} ${R2}; worker-src 'self' blob:; child-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'
            X-Content-Type-Options: nosniff
            Referrer-Policy: no-referrer
          /assets/*
            Cache-Control: public, max-age=31536000, immutable
          EOF

      - name: Set the staging gate password
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_APP_GATE_PASSWORD: ${{ secrets.STAGING_APP_GATE_PASSWORD }}
        run: printf '%s' "$STAGING_APP_GATE_PASSWORD" | npm exec --yes --ignore-scripts --package=wrangler@4.147.0 -- wrangler pages secret put STAGING_APP_GATE_PASSWORD --project-name "$PAGES_PROJECT"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: cd _site && npm exec --yes --ignore-scripts --package=wrangler@4.147.0 -- wrangler pages deploy . --project-name "$PAGES_PROJECT" --branch main --commit-hash "${{ github.sha }}"

  acceptance:
    needs: deploy
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: 24.11.0

      - name: Verify browser acceptance configuration
        env:
          SUPABASE_TEST_EMAIL: ${{ vars.SUPABASE_TEST_EMAIL }}
          SUPABASE_TEST_PASSWORD: ${{ secrets.SUPABASE_TEST_PASSWORD }}
          OPENOM_TEST_ACCOUNT_PASSPHRASE: ${{ vars.OPENOM_TEST_ACCOUNT_PASSPHRASE }}
          STAGING_APP_GATE_PASSWORD: ${{ secrets.STAGING_APP_GATE_PASSWORD }}
        run: node infra/deployment/deployment-config.mjs --validate-job staging.web.acceptance

      - name: Install browser acceptance dependencies
        run: |
          pnpm --dir apps install --frozen-lockfile --ignore-scripts
          pnpm --dir apps exec playwright install --with-deps chromium

      - name: Accept the deployed Supabase account round trip
        env:
          OPENOM_STAGING_AUTH_ACCEPTANCE: '1'
          OPENOM_STAGING_APP_URL: ${{ env.SITE_URL }}
          OPENOM_STAGING_COMMIT_SHA: ${{ github.sha }}
          SUPABASE_TEST_EMAIL: ${{ vars.SUPABASE_TEST_EMAIL }}
          SUPABASE_TEST_PASSWORD: ${{ secrets.SUPABASE_TEST_PASSWORD }}
          OPENOM_TEST_ACCOUNT_PASSPHRASE: ${{ vars.OPENOM_TEST_ACCOUNT_PASSPHRASE }}
          STAGING_APP_GATE_PASSWORD: ${{ secrets.STAGING_APP_GATE_PASSWORD }}
        run: pnpm --dir apps exec playwright test e2e/staging-auth.e2e.ts
