name: ci.mobile

# Android and iOS — an OPTIONAL build check, manual only (workflow_dispatch). The SDKs make every run
# expensive, and there is no release/signing pipeline yet: this only verifies that the Tauri mobile app
# builds. It produces UNSIGNED --debug artifacts (build-check / QA), NOT store releases. iOS only runs on macOS.
# When the real, signed release pipeline arrives, it MUST use --release (no debug_assertions).

on:
  workflow_dispatch:
  # Otherwise never triggered automatically. A twice-weekly build-check (Mon + Thu) catches mobile-build drift
  # (Android SDK / Tauri / Rust) without waiting for a manual run. Cron is UTC: 04:20 ≈ 05:20 German winter
  # (CET) / 06:20 summer (CEST) — early morning. macOS/iOS minutes are pricey, so twice a week, not per-push.
  schedule:
    - cron: '20 4 * * 1,4'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # `packages: platform-tools` drops the action's default `tools` (the obsolete "SDK Tools" package, removed
      # from the SDK — `sdkmanager tools` now fails with "Failed to find package 'tools'"). We only need
      # platform-tools here; the Gradle build fetches the required platform + build-tools itself (licenses are
      # pre-accepted). `log-accepted-android-sdk-licenses: false` suppresses the auto-accepted-license wall.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Android NDK
        run: sdkmanager --install "ndk;26.1.10909125"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      # Without pnpm-lock.yaml, setup-node will fail with a "cache" error. Once a
      # lockfile is committed: add "cache: pnpm" here, and use "--frozen-lockfile" below.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No lockfile in the tree — once one is committed, use
      # --frozen-lockfile here to prevent CI from silently updating dependencies.
      - run: pnpm install --no-frozen-lockfile
        working-directory: apps

      # gen/android is gitignored, so CI starts from a blank slate — scaffold it before building. --nostart keeps
      # init non-interactive (it does not try to open Android Studio / an emulator wrapper).
      - name: Initialize Android scaffolding
        env:
          CI: "true"
        run: pnpm tauri android init
        working-directory: apps

      # NOTE: --debug builds with debug_assertions ON, so this APK CONTAINS the dev-only destructive schema-reset
      # (store-schema). That is fine for a build-verification / QA artifact but this is NOT a store release — the
      # real signed release pipeline must use --release (no debug_assertions). Hence the artifact name below.
      - name: Build (debug APK, unsigned)
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: pnpm tauri android build --apk --debug
        working-directory: apps

      - uses: actions/upload-artifact@v4
        with:
          name: openom-android-debug
          path: apps/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

       # Without pnpm-lock.yaml, setup-node will fail if "cache" is enabled. Once a
       # lockfile is committed: add "cache: pnpm" here, and use "--frozen-lockfile" below.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No lockfile in the repository — once one is committed, use 
      # --frozen-lockfile here to prevent CI from silently updating dependencies.
      - run: pnpm install --no-frozen-lockfile
        working-directory: apps

      # NOTE: Tauri's iOS build re-runs `pnpm install` inside an Xcode script phase, which in a non-TTY context
      # would abort trying to purge node_modules. That's handled by `confirmModulesPurge: false` in
      # apps/pnpm-workspace.yaml (committed, so the nested install reads it) — no workflow step is needed here.

      # gen/apple is gitignored, so CI starts from a blank slate — scaffold it before building.
      - name: Initialize iOS scaffolding
        run: pnpm tauri ios init
        working-directory: apps

      # Without a signing certificate, only build for the simulator — this is enough for a check, and secrets do
      # not belong in a fork. --debug: same caveat as Android — a build-check artifact, not a release.
      - name: Build (simulator, unsigned)
        env:
          CI: "true"
        run: pnpm tauri ios build --target aarch64-sim --debug
        working-directory: apps
