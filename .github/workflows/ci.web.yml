name: ci.web

# Die Webapp ist reines ES-Modul-Werk ohne Build: pruefen heisst hier, dass
# jede Datei laedt und die Uebersetzungen vollstaendig sind.

on:
  pull_request:
  merge_group:
    types: [checks_requested]
    branches: [main]
  workflow_dispatch:

jobs:
  # The buildless runtime still has a strict author-time type gate. Build the gitignored wasm-bindgen
  # declarations first, then check the main-thread, native-host, and Web Worker graphs without emitting files.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: 22

      - name: Generate app-core wasm declarations
        run: node scripts/build-app-core.mjs

      - name: Type-check JavaScript boundaries
        run: node scripts/typecheck.mjs

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: 20

      # Syntaxpruefung ohne Bundler: node parst jedes Modul. Dank
      # "type": "module" in package.json gelten .js-Dateien als ES-Module.
      - name: Parse every module
        run: find apps/app/src -name '*.js' -print0 | xargs -0 -n1 node --check

      # Der Fehlercode-Generator (contracts/error-codes.json -> JS + Rust Spiegel) darf nicht driften.
      - name: Error codes in sync
        run: node scripts/gen-error-codes.mjs --check

      - name: Deployment configuration contract in sync
        run: |
          node --test scripts/deployment-config.test.mjs
          node scripts/deployment-config.mjs --check

      - name: Preview workflow security and lifecycle contracts
        run: |
          node --test \
            scripts/ci-scope.test.mjs \
            scripts/ci-workflow-policy.test.mjs \
            scripts/preview-cleanup-request.test.mjs \
            scripts/preview-cleanup-workflow-policy.test.mjs \
            scripts/preview-cleanup.test.mjs \
            scripts/preview-deployment.test.mjs \
            scripts/preview-instructions.test.mjs \
            scripts/preview-instructions-workflow-policy.test.mjs \
            scripts/preview-lambda.test.mjs \
            scripts/preview-name.test.mjs \
            scripts/preview-neon.test.mjs \
            scripts/preview-request.test.mjs \
            scripts/preview-route-reconcile.test.mjs \
            scripts/preview-router.test.mjs \
            scripts/preview-sink.test.mjs \
            scripts/preview-workflow-policy.test.mjs

      # Kein `.stack` darf je in die UI gerendert werden (nur Dev-Konsole).
      - name: Error hygiene
        run: node scripts/check-error-hygiene.mjs

      # Kein Auslieferungs-Build darf `tauri build --debug` nutzen: das brächte den zerstörerischen
      # Schema-Reset (store-sqlite, nur unter debug_assertions) in ein ausgeliefertes Binary.
      - name: No debug release build
        run: node scripts/check-no-debug-build.mjs

  # Eigener PARALLELER Job, damit fehlende Uebersetzungen sofort und unabhaengig
  # sichtbar sind — nicht als letzter Schritt hinter den anderen Pruefungen versteckt
  # (die bei einem frueheren Fehler diesen Schritt gar nicht erst erreichen).
  #
  # continue-on-error: dieser Job BLOCKIERT den Build NIE. Er ist rein informativ —
  # check-locales.mjs meldet fehlende Schluessel als ::warning:: (sichtbar), und selbst
  # ein harter Fehler (unbekannter Schluessel, exit 1) wird angezeigt, laesst den Workflow-
  # Lauf aber gruen. So bleibt es wie bisher: sichtbar, nie blockierend.
  locales:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: 20

      - name: Locales complete
        run: node scripts/check-locales.mjs
        working-directory: apps
