name: staging.smoke

# Provider and deployed-application checks remain one reusable workflow, grouped into five independently
# diagnosable jobs. The configuration check receives no secrets; each other job receives only the
# credential set needed for its group.
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * 1,4'

permissions:
  contents: read

concurrency:
  group: staging.smoke
  cancel-in-progress: false

jobs:
  configuration:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: Verify staging variables
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_JWT_ISS: ${{ vars.SUPABASE_JWT_ISS }}
          SUPABASE_JWT_AUD: ${{ vars.SUPABASE_JWT_AUD }}
          SUPABASE_JWKS_URL: ${{ vars.SUPABASE_JWKS_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_TEST_EMAIL: ${{ vars.SUPABASE_TEST_EMAIL }}
          AXIOM_OTLP_ENDPOINT: ${{ vars.AXIOM_OTLP_ENDPOINT }}
          AXIOM_DATASET: ${{ vars.AXIOM_DATASET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          OPENOM_WEB_ORIGINS: ${{ vars.OPENOM_WEB_ORIGINS }}
        run: node infra/deployment/deployment-config.mjs --validate-job staging.smoke.configuration

  infrastructure:
    needs: configuration
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: Verify infrastructure configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          CLOUDFLARE_PAGES_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node infra/deployment/deployment-config.mjs --validate-job staging.smoke.infrastructure

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Verify the staging deployment identity
        run: aws sts get-caller-identity > /dev/null

      - name: Read the staging Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: openom-staging-web
        run: |
          set -euo pipefail
          response=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT")
          jq -e --arg project "$PAGES_PROJECT" '.success == true and .result.name == $project' <<<"$response" > /dev/null

  storage:
    needs: configuration
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: Verify storage configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_MIGRATION: ${{ secrets.DATABASE_URL_MIGRATION }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: node infra/deployment/deployment-config.mjs --validate-job staging.smoke.storage

      - name: Connect to Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_MIGRATION: ${{ secrets.DATABASE_URL_MIGRATION }}
        run: |
          set -euo pipefail
          image='postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94'
          pooled=$(docker run --rm -e DATABASE_URL "$image" sh -c 'psql "$DATABASE_URL" -tAc "select 1;"')
          direct=$(docker run --rm -e DATABASE_URL_MIGRATION "$image" sh -c 'psql "$DATABASE_URL_MIGRATION" -tAc "select 1;"')
          test "$pooled" = '1'
          test "$direct" = '1'

      - name: Put, get, and delete an R2 object
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          image='amazon/aws-cli:2.31.22@sha256:bf253be91e12d49ba1bd6dc939a76ea9777901772032692b14639e643118e1c1'
          key="smoke/heartbeat-${GITHUB_RUN_ID}.txt"
          printf 'staging smoke %s\n' "$(date -u +%FT%TZ)" > "$RUNNER_TEMP/heartbeat.txt"
          docker run --rm -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION -e AWS_EC2_METADATA_DISABLED -e AWS_REQUEST_CHECKSUM_CALCULATION -e AWS_RESPONSE_CHECKSUM_VALIDATION -v "$RUNNER_TEMP:/work" "$image" s3api put-object --endpoint-url "$R2_ENDPOINT" --bucket "$R2_BUCKET" --key "$key" --body /work/heartbeat.txt > /dev/null
          docker run --rm -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION -e AWS_EC2_METADATA_DISABLED -e AWS_REQUEST_CHECKSUM_CALCULATION -e AWS_RESPONSE_CHECKSUM_VALIDATION -v "$RUNNER_TEMP:/work" "$image" s3api get-object --endpoint-url "$R2_ENDPOINT" --bucket "$R2_BUCKET" --key "$key" /work/downloaded.txt > /dev/null
          diff "$RUNNER_TEMP/heartbeat.txt" "$RUNNER_TEMP/downloaded.txt"
          docker run --rm -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION -e AWS_EC2_METADATA_DISABLED -e AWS_REQUEST_CHECKSUM_CALCULATION -e AWS_RESPONSE_CHECKSUM_VALIDATION "$image" s3api delete-object --endpoint-url "$R2_ENDPOINT" --bucket "$R2_BUCKET" --key "$key" > /dev/null

  authentication:
    needs: configuration
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: 24.11.0

      - name: Verify authentication configuration
        env:
          SUPABASE_JWT_ISS: ${{ vars.SUPABASE_JWT_ISS }}
          SUPABASE_JWT_AUD: ${{ vars.SUPABASE_JWT_AUD }}
          SUPABASE_JWKS_URL: ${{ vars.SUPABASE_JWKS_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_TEST_EMAIL: ${{ vars.SUPABASE_TEST_EMAIL }}
          SUPABASE_TEST_PASSWORD: ${{ secrets.SUPABASE_TEST_PASSWORD }}
          OPENOM_TEST_ACCOUNT_PASSPHRASE: ${{ vars.OPENOM_TEST_ACCOUNT_PASSPHRASE }}
          STAGING_APP_GATE_PASSWORD: ${{ secrets.STAGING_APP_GATE_PASSWORD }}
        run: node infra/deployment/deployment-config.mjs --validate-job staging.smoke.authentication

      - name: Sign in and verify the token against JWKS
        env:
          SUPABASE_JWT_ISS: ${{ vars.SUPABASE_JWT_ISS }}
          SUPABASE_JWT_AUD: ${{ vars.SUPABASE_JWT_AUD }}
          SUPABASE_JWKS_URL: ${{ vars.SUPABASE_JWKS_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_TEST_EMAIL: ${{ vars.SUPABASE_TEST_EMAIL }}
          SUPABASE_TEST_PASSWORD: ${{ secrets.SUPABASE_TEST_PASSWORD }}
        run: |
          npm --prefix scripts/test/smoke install --no-audit --no-fund --ignore-scripts
          node scripts/test/smoke/supabase-smoke.mjs

      - name: Install browser acceptance dependencies
        run: |
          pnpm --dir apps install --frozen-lockfile --ignore-scripts
          pnpm --dir apps exec playwright install --with-deps chromium

      - name: Accept the deployed account round trip
        env:
          OPENOM_STAGING_AUTH_ACCEPTANCE: '1'
          OPENOM_STAGING_APP_URL: https://app.staging.openom.org/
          SUPABASE_TEST_EMAIL: ${{ vars.SUPABASE_TEST_EMAIL }}
          SUPABASE_TEST_PASSWORD: ${{ secrets.SUPABASE_TEST_PASSWORD }}
          OPENOM_TEST_ACCOUNT_PASSPHRASE: ${{ vars.OPENOM_TEST_ACCOUNT_PASSPHRASE }}
          STAGING_APP_GATE_PASSWORD: ${{ secrets.STAGING_APP_GATE_PASSWORD }}
        run: pnpm --dir apps exec playwright test e2e/staging-auth.e2e.ts

  observability:
    needs: configuration
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Verify observability configuration
        env:
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
          AXIOM_OTLP_ENDPOINT: ${{ vars.AXIOM_OTLP_ENDPOINT }}
          AXIOM_DATASET: ${{ vars.AXIOM_DATASET }}
        run: node infra/deployment/deployment-config.mjs --validate-job staging.smoke.observability

      - name: Emit a trace through the openom exporter
        env:
          OPENOM_OTEL: '1'
          OPENOM_ENV: staging
          OPENOM_STACK: otel-smoke
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.AXIOM_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: authorization=Bearer ${{ secrets.AXIOM_TOKEN }},x-axiom-dataset=${{ vars.AXIOM_DATASET }}
        run: cargo run -p openom --bin otel_smoke
