name: ci.desktop

# Pull requests get a quick Linux Clippy signal. The full Windows/macOS/Linux test + Tauri-build matrix runs
# only for the merge queue's final candidate (or an explicit manual run), never again after that candidate lands
# on main. `desktop-gate` is the stable required-check context across both event types.
on:
  pull_request:
  merge_group:
    types: [checks_requested]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      desktop_required: ${{ steps.scope.outputs.desktop_required }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0
      - id: scope
        name: Classify the candidate
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            printf 'desktop_required=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = pull_request ]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$MERGE_BASE_SHA"
          fi
          test -n "$base_sha"
          git diff --name-only "$base_sha" "$GITHUB_SHA" |
            node scripts/ci-scope.mjs --github-output "$GITHUB_OUTPUT"

  clippy:
    needs: classify
    if: needs.classify.outputs.desktop_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable 2026-10-01
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: .
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file \
            libssl-dev libgtk-3-dev
      - name: Clippy (pedantic + cargo gate)
        run: cargo clippy --workspace --all-features

  build:
    needs: [classify, clippy]
    if: >-
      ${{ always()
          && needs.classify.outputs.desktop_required == 'true'
          && needs.clippy.result == 'success'
          && github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable 2026-10-01
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: .
      - name: System libraries (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file \
            libssl-dev libgtk-3-dev
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
        working-directory: apps
      - name: Store conformance suite
        run: cargo test --workspace --all-features
      - name: Build the Tauri application
        run: pnpm tauri build --no-bundle
        working-directory: apps

  desktop-gate:
    name: desktop-gate
    needs: [classify, clippy, build]
    if: always()
    runs-on: ubuntu-latest
    env:
      EVENT_NAME: ${{ github.event_name }}
      CLASSIFY_RESULT: ${{ needs.classify.result }}
      DESKTOP_REQUIRED: ${{ needs.classify.outputs.desktop_required }}
      CLIPPY_RESULT: ${{ needs.clippy.result }}
      BUILD_RESULT: ${{ needs.build.result }}
    steps:
      - name: Enforce the event-specific desktop gate
        run: |
          set -euo pipefail
          test "$CLASSIFY_RESULT" = success
          if [ "$DESKTOP_REQUIRED" != true ]; then
            exit 0
          fi
          test "$CLIPPY_RESULT" = success
          if [ "$EVENT_NAME" != pull_request ]; then
            test "$BUILD_RESULT" = success
          fi
