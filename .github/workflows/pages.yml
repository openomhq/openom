name: Deploy to GitHub Pages

# Publishes the web app to GitHub Pages. The app ships as Tauri loads it — no bundler — but it loads ONE
# gitignored build artifact, the openom-app-core wasm, which CI must compile before assembling the site.
# Then %SITE_URL% / %LANDING% are filled in.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Build the one wasm module the app loads (openom-app-core) — it's a gitignored artifact, absent on a
      # fresh checkout. The script compiles Rust→wasm in Docker (pre-installed on the runner) and runs
      # wasm-bindgen (version-pinned to Cargo.lock) natively. Uncached, ~several minutes — fine for a manual deploy.
      - name: Build the app-core wasm
        run: node scripts/build-app-core.mjs

      # Visitors land in the app, not in a preview page. The device frames sit
      # next to it under /preview.html.
      # .nojekyll: otherwise Pages swallows folders with a leading underscore.
      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r apps/app/. _site/
          cp -r assets _site/assets
          cp apps/preview/desktop.html _site/preview.html
          sed -i 's#\.\./app/index.html#index.html#g' _site/preview.html
          touch _site/.nojekyll

      # Absolute origin for the social-preview meta. The deploy knows its own
      # URL, so .env.demo is only the fallback for local and fork runs.
      # This Pages deploy is a public DEMO/preview (no managed server wired → local-only), so the landing is
      # the demo. A production deploy sets OPENOM_LANDING=live (or omits it — 'live' is the default).
      - name: Fill in SITE_URL
        working-directory: apps
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          OPENOM_LANDING: "demo"
        run: node scripts/site-url.mjs ../_site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
