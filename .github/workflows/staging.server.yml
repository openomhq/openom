name: staging.server

# Manual or orchestrated staging deployment. Build runs without the staging environment, secrets, or AWS OIDC.
# Deploy receives the verified build artifact and only the credentials required for migration and
# publication. Acceptance probes the public API without inheriting deployment credentials.
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: staging.server
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: eu-central-1
  ARTIFACTS_BUCKET: openom-staging-artifacts-841547768414

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.97.1
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2.8.1

      - name: Install checksum-verified Zig and cargo-lambda
        run: |
          set -euo pipefail
          curl -fsSL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o /tmp/zig.tar.xz
          echo 'd45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea  /tmp/zig.tar.xz' | sha256sum -c -
          mkdir -p "$HOME/.zig"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/.zig" --strip-components=1
          echo "$HOME/.zig" >> "$GITHUB_PATH"

          curl -fsSL https://github.com/cargo-lambda/cargo-lambda/releases/download/v1.9.2/cargo-lambda-v1.9.2.x86_64-unknown-linux-musl.tar.gz -o /tmp/cargo-lambda.tar.gz
          echo 'b5c258c424ebaef39541c3641f33c51137ee6c426016f365628fedb2c737271d  /tmp/cargo-lambda.tar.gz' | sha256sum -c -
          mkdir -p /tmp/cargo-lambda
          tar -xzf /tmp/cargo-lambda.tar.gz -C /tmp/cargo-lambda
          sudo install "$(find /tmp/cargo-lambda -type f -name cargo-lambda -print -quit)" /usr/local/bin/cargo-lambda

      - name: Build the Lambda
        run: cargo lambda build --release --arm64 -p openom --bin openom --output-format zip

      - name: Stage and hash the deployment artifact
        run: |
          set -euo pipefail
          zip=$(find target/lambda -name bootstrap.zip -print -quit)
          test -n "$zip" || { echo 'no bootstrap.zip under target/lambda'; exit 1; }
          mkdir -p _artifact
          cp "$zip" _artifact/bootstrap.zip
          (cd _artifact && sha256sum bootstrap.zip > SHA256SUMS)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-server-${{ github.sha }}
          path: _artifact/
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: staging-server-${{ github.sha }}
          path: _artifact

      - name: Verify staging configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          DATABASE_URL_MIGRATION: ${{ secrets.DATABASE_URL_MIGRATION }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TOFU_STATE_PASSPHRASE_SERVER: ${{ secrets.TOFU_STATE_PASSPHRASE_SERVER }}
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
          OPENOM_INTERNAL_GC_TOKEN: ${{ secrets.OPENOM_INTERNAL_GC_TOKEN }}
          AXIOM_DATASET: ${{ vars.AXIOM_DATASET }}
          AXIOM_OTLP_ENDPOINT: ${{ vars.AXIOM_OTLP_ENDPOINT }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          SUPABASE_JWKS_URL: ${{ vars.SUPABASE_JWKS_URL }}
          SUPABASE_JWT_ISS: ${{ vars.SUPABASE_JWT_ISS }}
          SUPABASE_JWT_AUD: ${{ vars.SUPABASE_JWT_AUD }}
          OPENOM_WEB_ORIGINS: ${{ vars.OPENOM_WEB_ORIGINS }}
        run: node scripts/deployment-config.mjs --validate-job staging.server.deploy

      - name: Verify the deployment artifact
        run: cd _artifact && sha256sum -c SHA256SUMS

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload the SHA-keyed artifact
        run: aws s3 cp _artifact/bootstrap.zip "s3://${ARTIFACTS_BUCKET}/openom/${GITHUB_SHA}.zip"

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.68.14
        with:
          tool: sqlx-cli@0.9.0

      - name: Migrate using the direct database URL
        env:
          DATABASE_URL_MIGRATION: ${{ secrets.DATABASE_URL_MIGRATION }}
        run: sqlx migrate run --source openom/migrations --database-url "$DATABASE_URL_MIGRATION"

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false

      - name: Apply staging infrastructure
        working-directory: infra/terraform
        env:
          TF_VAR_lambda_artifact_key: openom/${{ github.sha }}.zip
          TF_VAR_database_url: ${{ secrets.DATABASE_URL }}
          TF_VAR_s3_access_key: ${{ secrets.R2_ACCESS_KEY_ID }}
          TF_VAR_s3_secret_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_VAR_otlp_headers: authorization=Bearer ${{ secrets.AXIOM_TOKEN }},x-axiom-dataset=${{ vars.AXIOM_DATASET }}
          TF_VAR_internal_gc_token: ${{ secrets.OPENOM_INTERNAL_GC_TOKEN }}
          TF_VAR_otlp_endpoint: ${{ vars.AXIOM_OTLP_ENDPOINT }}
          TF_VAR_s3_endpoint: ${{ vars.R2_ENDPOINT }}
          TF_VAR_s3_public_endpoint: ${{ vars.R2_ENDPOINT }}
          TF_VAR_s3_bucket: ${{ vars.R2_BUCKET }}
          TF_VAR_s3_region: auto
          TF_VAR_jwks_url: ${{ vars.SUPABASE_JWKS_URL }}
          TF_VAR_jwt_issuer: ${{ vars.SUPABASE_JWT_ISS }}
          TF_VAR_jwt_audience: ${{ vars.SUPABASE_JWT_AUD }}
          TF_VAR_web_origins: ${{ vars.OPENOM_WEB_ORIGINS }}
          TF_VAR_state_passphrase: ${{ secrets.TOFU_STATE_PASSPHRASE_SERVER }}
        run: |
          tofu init -backend-config=env/staging.s3.tfbackend
          tofu apply -auto-approve -var-file=env/staging.tfvars

  acceptance:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the public API health endpoint
        run: curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 https://api.staging.openom.org/health
