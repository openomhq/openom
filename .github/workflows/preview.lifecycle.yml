name: preview.lifecycle
run-name: preview lifecycle signal

on:
  pull_request:
    types:
      - closed
      - labeled
      - unlabeled
    branches:
      - main

permissions: {}

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Signal preview lifecycle reconciliation
        run: echo 'Preview lifecycle state changed; trusted cleanup will resolve the pull request from GitHub-owned workflow metadata.'
