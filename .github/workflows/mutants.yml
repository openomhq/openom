name: mutants

# Mutation testing (cargo-mutants) for the security-critical crates plus the pure core: it edits the
# code in small ways (a mutant) and re-runs that crate's tests, checking each break is CAUGHT — surfacing
# gaps a green suite hides. The default set is the security-critical crypto / envelope / keyring / CRDT crates
# (edsign, openom-crypto, keyeo-crypto, openom-sealer, openom-data-crdt, and the keyring engines keyeo-chain /
# keyeo-dag + openom-keyring-chain / openom-keyring-dag) + the PURE crates from the OPE-243 purity audit
# (openom-protocol / openom-roles / did / format-jcs / format-edtf / openom-data-model / openom-data-projection)
# — pure means fast, deterministic, no-I/O tests, so mutating them is cheap. Runs on DEFAULT features (not
# --all-features: the tree `wasm` feature needs a wasm32 target and would break the native build). Runs WEEKLY
# (Monday, early UTC) and on demand: a full run re-runs the suite once per mutant and is slow, so it's not a
# per-push gate. Dispatch it after a meaningful change to the covered crates too, and read the surviving
# mutants in the uploaded report.

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Crates to mutate (space-separated; leave empty for the default security-critical set — crypto/keyring/CRDT + pure core). All must already have real test coverage.'
        default: ''
  schedule:
    # Weekly deep run — Monday 03:13 UTC (≈ 04:13 CET winter / 05:13 CEST summer). At ~2h it finishes
    # ~06–07am German, a wide buffer before 9 even if GitHub delays the scheduled start. Cron has NO
    # workflow_dispatch inputs, so the run step falls back to DEFAULT_PACKAGES below.
    - cron: '13 3 * * 1'

env:
  CARGO_TERM_COLOR: always
  # Mutation testing's kill signal comes mainly from the deterministic unit tests; the proptests are extra
  # RANDOM exploration, and they run once per mutant of their crate — the heavy ones (keyring-dag's ladder
  # proofs ~15s, keyring-chain's oracle ~9s) otherwise dominate the ~2h run. Dial proptest's case count DOWN
  # for THIS workflow only; the web/desktop/integration workflows run plain `cargo test` and keep proptest's
  # default 256-case coverage. Before trusting this (and before lowering --timeout below), dispatch once and
  # confirm the survivor list gains nothing vs a full-cases run — a mutant only 256 cases would kill would
  # otherwise show as a false survivor.
  PROPTEST_CASES: '64'
  # The canonical default set (one source of truth for both the cron run and a no-input dispatch): the
  # security-critical crypto / envelope / keyring / CRDT crates + the PURE crates from the OPE-243 audit.
  DEFAULT_PACKAGES: 'edsign openom-crypto keyeo-crypto openom-sealer openom-data-crdt keyeo-chain keyeo-dag openom-keyring-chain openom-keyring-dag openom-protocol openom-roles did format-jcs format-edtf openom-data-model openom-data-projection'

jobs:
  mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # openom-tauri (in the workspace) pulls WebKitGTK sys-crates; install the system libs so the
      # baseline workspace build never fails on them, whichever crates we scope to. Mirrors desktop.yml.
      - name: System libraries (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      # -p scopes both the mutated files and the build/test to the named crates (+ their deps), so
      # unrelated crates — including the GTK-heavy openom-tauri — aren't mutated. --in-place mutates the
      # fresh checkout directly (no per-mutant copy). A mutant that no test kills is a coverage gap.
      - name: cargo mutants
        run: |
          set -euo pipefail
          # The packages input overrides; empty (a no-input dispatch, or ANY scheduled run) falls back to
          # DEFAULT_PACKAGES — without this a cron run would pass no --package and mutate the whole workspace.
          pkgs="${{ github.event.inputs.packages }}"; pkgs="${pkgs:-$DEFAULT_PACKAGES}"
          args=()
          for p in $pkgs; do args+=("--package" "$p"); done
          # --baseline=skip so the fixed --timeout bounds ONLY per-mutant tests (one crate, a few seconds), not
          # the whole-suite unmutated baseline (~51s across all 16 crates) — a baseline that exceeds --timeout is
          # FATAL (exit 4), unlike a per-mutant timeout which is just recorded and skipped. The tree's green state
          # is already verified by the web/desktop/integration workflows, so skipping the baseline check is safe.
          # 17s clears the observed legit test tail (p95 15.0s / p99 15.2s / max 15.4s from the 2026-09-16 run — a
          # ~1.6s margin for runner variance) yet still kills a runaway-allocation mutant far below the ~110s point
          # where such a mutant fills RAM and OOM-kills the whole runner. Don't drop below ~16s: a real ~15s test
          # cohort (top ~10%) would start false-timing-out.
          cargo mutants -vV --in-place --baseline=skip --timeout 17 "${args[@]}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-out
          path: mutants.out
