# Local dev stack for the openom server (OPENOM_RUNTIME=local). Everything is decoupled
# from the cloud: MinIO stands in for Cloudflare R2, a Postgres container for Neon.
# The server rebuilds and restarts on source changes via cargo-watch.
#
#   docker compose up --build     # server (:6060), Postgres (:5432), MinIO (:9000, console :9001)
#   docker compose down           # stop
#   docker compose down -v        # stop and wipe the data + build-cache volumes
#
# Real Supabase Auth is opt-in and does not replace DevAuth for ordinary local work:
#   COMPOSE_PROFILES=supabase-auth docker compose up supabase-auth-gateway
# Prefer `pnpm test:e2e:supabase-auth` from apps/ for the reproducible ES256/JWKS acceptance.
#
# First `up` compiles the server (a few minutes); after that the target volume
# caches it, so restarts are fast. Health: http://localhost:6060/health and
# http://localhost:6060/ready (the latter pings Postgres).
services:
  server:
    build:
      context: .
      dockerfile: openom/Dockerfile
    image: openom-server-dev:latest
    # --poll: file-change events don't cross the Windows→container bind mount
    # reliably, so poll instead of relying on inotify. -w scopes the poll WALK to just
    # the Rust source (openom/ + packages/ + the workspace manifests) instead of the
    # whole bind-mounted repo — the default walk re-stats the host's native `target`,
    # node_modules, .git and apps/ every cycle, which on a Windows mount is pathologically
    # slow. (--ignore is only a post-walk event filter and does NOT prune the walk; the
    # -w allow-list does.) NOTE: on Windows the poll can still be slow to reach the first
    # build; if it stalls, force the compile once with
    #   docker compose exec server sh -c 'cd /work && cargo build -p openom'
    # after which cargo-watch's `cargo run` starts serving in seconds (deps are cached).
    command: ["cargo", "watch", "--poll",
              "-w", "openom", "-w", "packages", "-w", "Cargo.toml", "-w", "Cargo.lock",
              "-x", "run -p openom --bin openom"]
    working_dir: /work
    environment:
      # OPENOM_RUNTIME=local presets STORAGE=local (MinIO) + AUTH=dev (fake auth: any bearer
      # that parses as a UUID *is* that member). To instead run against a local Supabase
      # for real JWT verification, override the auth axis only — leave storage on MinIO:
      #   AUTH: jwt
      #   AUTH_JWT_SECRET: <your local supabase JWT secret>   # alias SUPABASE_JWT_SECRET
      # (aud defaults to "authenticated"; set AUTH_JWT_AUD to override / empty to opt out.)
      # For an asymmetric issuer instead (Clerk / Auth0 / OIDC / self-hosted), point at its JWKS:
      #   AUTH: jwt
      #   AUTH_JWT_ALG: RS256
      #   AUTH_JWKS_URL: https://<issuer>/.well-known/jwks.json
      #   AUTH_JWT_ISS: https://<issuer>     # optional issuer pin
      # No issuer is baked into the code — swapping providers is a config change, not a rebuild.
      OPENOM_RUNTIME: local
      OPENOM_HTTP_ADDR: 0.0.0.0:${OPENOM_HTTP_PORT:-6060}
      # The local browser app runs on a separate origin from the API. Keep the default convenient while
      # allowing another exact development origin to be supplied through .env or the shell.
      OPENOM_WEB_ORIGINS: "${OPENOM_WEB_ORIGINS:-http://localhost:5173}"
      DATABASE_URL: postgres://openom:openom@postgres:5432/openom
      S3_ENDPOINT: http://minio:9000
      # Presigned URLs handed to clients must be reachable from the host/browser, not
      # the in-cluster minio hostname (the SigV4 signature binds the host).
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_BUCKET: openom-trees
      S3_REGION: us-east-1
      S3_ACCESS_KEY: openom
      S3_SECRET_KEY: openompw123
      CARGO_TARGET_DIR: /tmp/target
      RUST_LOG: info,openom=debug
      # Observability (opt-in). The exporter only runs when OPENOM_OTEL=1 *and* the
      # `lgtm` service is up (COMPOSE_PROFILES=observability); otherwise the server
      # just logs to stdout. Endpoint targets the bundled collector's OTLP/HTTP port.
      OPENOM_OTEL: "${OPENOM_OTEL:-0}"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
    ports:
      # Host port from .env (OPENOM_HTTP_PORT); default 6060.
      - "${OPENOM_HTTP_PORT:-6060}:${OPENOM_HTTP_PORT:-6060}"
    volumes:
      - type: bind
        source: .
        target: /work
      - openom-server-cargo:/usr/local/cargo/registry
      - openom-server-target:/tmp/target
    depends_on:
      postgres:
        condition: service_healthy   # migrations run at startup — wait for the DB
      minio:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: openom
      POSTGRES_PASSWORD: openom
      POSTGRES_DB: openom
    ports:
      - "5432:5432"
    volumes:
      - openom-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openom -d openom"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    # quay.io, not Docker Hub: MinIO removed the community `minio/minio` from Docker Hub (the successor, AIStor,
    # is a licensed product); quay.io/minio/minio is the still-anonymously-pullable community image. Because the
    # community edition is discontinued, PIN a specific frozen RELEASE tag (immutable — MinIO never repoints a
    # RELEASE.* tag) for reproducibility, rather than a drifting `:latest` on a repo that no longer moves. This is
    # the exact version the server contract suite is verified against.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: openom
      MINIO_ROOT_PASSWORD: openompw123
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - openom-minio:/data

  # A real, pinned Supabase Auth service for local integration tests. All three services live behind
  # a profile so ordinary `docker compose up` remains the lightweight DevAuth stack. The acceptance
  # runner supplies an ephemeral ES256 private JWK through OPENOM_SUPABASE_JWT_KEYS; no signing key is
  # committed or written to disk.
  supabase-auth-db:
    image: postgres:17-alpine
    profiles: ["supabase-auth"]
    environment:
      # GoTrue's pinned migrations grant read access to a role literally named `postgres`.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-local-only
      POSTGRES_DB: gotrue
    volumes:
      - supabase-auth-db:/var/lib/postgresql/data
    configs:
      - source: supabase_auth_db_init
        target: /docker-entrypoint-initdb.d/001-auth-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gotrue"]
      interval: 2s
      timeout: 3s
      retries: 30

  supabase-auth:
    image: supabase/auth:v2.197.0
    profiles: ["supabase-auth"]
    depends_on:
      supabase-auth-db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: "http://localhost:${OPENOM_SUPABASE_AUTH_PORT:-9999}/auth/v1"
      GOTRUE_DB_DRIVER: postgres
      DATABASE_URL: postgres://postgres:postgres-local-only@supabase-auth-db:5432/gotrue
      # v2.197.0 expects a JSON ARRAY of private JWKs. The selected key must include `sign` in key_ops.
      GOTRUE_JWT_KEYS: "${OPENOM_SUPABASE_JWT_KEYS:-[]}"
      GOTRUE_JWT_ISSUER: "http://localhost:${OPENOM_SUPABASE_AUTH_PORT:-9999}/auth/v1"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_EXP: "3600"
      # GoTrue still requires the legacy secret even when asymmetric keys are configured; JWT_KEYS wins.
      GOTRUE_JWT_SECRET: openom-local-gotrue-fallback-secret-32-chars
      GOTRUE_SITE_URL: http://localhost:5173
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_ADMIN_EMAIL: admin@openom.local

  # Hosted Supabase exposes GoTrue below /auth/v1; bare GoTrue serves from /. Keep the local and hosted
  # client contracts identical and add the browser CORS headers normally supplied by Supabase's gateway.
  supabase-auth-gateway:
    image: caddy:2.10.2-alpine
    profiles: ["supabase-auth"]
    depends_on:
      supabase-auth:
        condition: service_started
    ports:
      - "${OPENOM_SUPABASE_AUTH_PORT:-9999}:9999"
    configs:
      - source: supabase_auth_caddyfile
        target: /etc/caddy/Caddyfile

  # Local observability, opt-in to spare the machine. grafana/otel-lgtm is an
  # all-in-one image: one OTLP endpoint (4317 gRPC / 4318 HTTP) feeding Grafana +
  # Loki (logs) + Tempo (traces) + Prometheus/Mimir (metrics). It does NOT start by
  # default — enable it by setting COMPOSE_PROFILES=observability in .env (and
  # OPENOM_OTEL=1 so the server actually exports). Data is ephemeral by design.
  lgtm:
    image: grafana/otel-lgtm:latest
    profiles: ["observability"]
    ports:
      - "${OPENOM_GRAFANA_PORT:-3000}:3000"   # Grafana UI
      - "4317:4317"                           # OTLP gRPC
      - "4318:4318"                           # OTLP HTTP

volumes:
  openom-server-cargo:
  openom-server-target:
  openom-postgres:
  openom-minio:
  supabase-auth-db:

configs:
  supabase_auth_db_init:
    content: |
      CREATE SCHEMA IF NOT EXISTS auth AUTHORIZATION postgres;
      ALTER ROLE postgres IN DATABASE gotrue SET search_path = auth, public;
  supabase_auth_caddyfile:
    content: |
      :9999 {
          @preflight method OPTIONS
          handle @preflight {
              header Access-Control-Allow-Origin "http://localhost:5173"
              header Access-Control-Allow-Methods "GET, POST, OPTIONS"
              header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, x-supabase-api-version"
              header Access-Control-Max-Age "3600"
              header Vary "Origin"
              respond 204
          }
          handle_path /auth/v1/* {
              header Access-Control-Allow-Origin "http://localhost:5173"
              header Vary "Origin"
              reverse_proxy supabase-auth:9999 {
                  header_up Host supabase-auth:9999
                  header_down -Access-Control-Allow-Origin
                  header_down -Access-Control-Allow-Credentials
              }
          }
          respond "openom local Supabase Auth gateway" 200
      }
